<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>check — быстрый ИИ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f4f2;
    --card: rgba(255,255,255,0.72);
    --text: #1a1a1a;
    --text-dim: #5a5a60;
    --text-mute: #8a8a92;
    --glass-bg: rgba(255,255,255,0.62);
    --glass-border: rgba(255,255,255,0.72);
    --bot-bg: #ffffff;
    --chip-bg: rgba(255,255,255,0.85);
    --hairline: rgba(0,0,0,0.07);
    --dot-color: #f5c518;
    --dot-color-soft: rgba(245,197,24,0.15);
  }
  html.dark {
    --bg: #131316;
    --card: rgba(38,38,44,0.72);
    --text: #f2f2f4;
    --text-dim: #b6b6bd;
    --text-mute: #86868e;
    --glass-bg: rgba(38,38,44,0.65);
    --glass-border: rgba(255,255,255,0.08);
    --bot-bg: #26262c;
    --chip-bg: rgba(48,48,56,0.75);
    --hairline: rgba(255,255,255,0.09);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overscroll-behavior: none; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; }
  svg, img { display: block; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  #home-screen {
    flex: 1; overflow-y: auto;
    padding: 0 14px 140px 14px;
    -webkit-overflow-scrolling: touch;
    display: block; background: var(--bg);
  }
  #home-screen.hidden { display: none; }
  .home-topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 10px 2px;
    background: linear-gradient(to bottom, var(--bg) 65%, transparent);
  }
  .home-topbar .home-left { display: flex; gap: 8px; }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
  }
  .menu-btn:active { transform: scale(.93); }

  .date-group { margin-bottom: 16px; }
  .date-label {
    font-size: 15px; font-weight: 500;
    color: var(--text-mute); letter-spacing: -0.2px;
    padding: 10px 4px 8px 4px;
  }
  .chats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; width: 100%;
  }
  .chat-card {
    border-radius: 24px; cursor: pointer;
    transition: transform .15s;
    position: relative; overflow: hidden; min-height: 180px;
    display: flex; flex-direction: column;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    border: 1px solid var(--glass-border);
    user-select: none; -webkit-user-select: none;
    width: 100%; box-sizing: border-box;
  }
  .chat-card:active { transform: scale(.975); }
  .chat-card.dot-card {
    background: linear-gradient(135deg, var(--dot-color-soft, transparent) 0%, var(--card) 60%);
  }
  .chat-card .card-dot {
    position: absolute; top: 8px; right: 8px;
    width: 44px; height: 44px; z-index: 2;
    animation: cardDotBounce 2.4s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  .chat-card .card-dot img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes cardDotBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .chat-card .card-body {
    padding: 14px 16px 18px 16px;
    display: flex; flex-direction: column; gap: 8px;
    flex: 1; min-height: 0; width: 100%; box-sizing: border-box;
    overflow: hidden; position: relative; z-index: 1;
  }
  .chat-card .card-title {
    font-size: 22px; font-weight: 700; color: var(--text);
    line-height: 1.1; letter-spacing: -0.7px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word; width: 100%;
    padding-right: 48px;
  }
  .chat-card .card-preview {
    font-size: 14.5px; color: var(--text-mute); line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
    overflow: hidden; letter-spacing: -0.15px; width: 100%;
  }

  .fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 64px; height: 64px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 15;
    transition: transform .12s;
  }
  .fab:active { transform: scale(.92); }
  .fab-dots { left: 20px; color: var(--text); }
  .fab-new {
    right: 20px; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .dots-popover {
    position: fixed;
    left: 20px;
    bottom: calc(96px + env(safe-area-inset-bottom));
    width: 230px;
    border-radius: 24px;
    padding: 8px;
    z-index: 100;
    display: none;
    animation: popFromBottom .22s cubic-bezier(.2,.9,.3,1.1);
    transform-origin: bottom left;
    background: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.68) 45%, rgba(255,255,255,0.8) 100%);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.72);
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 12px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  html.dark .dots-popover {
    background: linear-gradient(135deg, rgba(40,40,46,0.85) 0%, rgba(30,30,36,0.7) 45%, rgba(38,38,44,0.82) 100%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dots-popover.visible { display: block; }
  @keyframes popFromBottom {
    from { opacity: 0; transform: scale(.85) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .dots-popover-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 14.5px; font-weight: 500;
    color: var(--text);
    transition: background .12s;
    letter-spacing: -0.2px;
    position: relative;
  }
  .dots-popover-item:active { background: rgba(127,127,127,0.14); }
  .dots-popover-item svg { flex-shrink: 0; width: 20px; height: 20px; opacity: 0.85; }
  .dots-popover-sep { height: 1px; background: var(--hairline); margin: 4px 12px; }

  .ctx-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn .16s ease;
  }
  .ctx-overlay.visible { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } }
  .ctx-menu {
    width: 240px;
    border-radius: 22px;
    padding: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.85) 100%);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.72);
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 16px 48px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    animation: popFromCenter .22s cubic-bezier(.2,.9,.3,1.1);
    position: relative; overflow: hidden;
  }
  html.dark .ctx-menu {
    background: linear-gradient(135deg, rgba(40,40,46,0.88) 0%, rgba(30,30,36,0.72) 45%, rgba(38,38,44,0.85) 100%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  @keyframes popFromCenter {
    from { opacity: 0; transform: scale(.9) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .ctx-title {
    padding: 8px 12px 4px;
    font-size: 11px; color: var(--text-mute);
    font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 13.5px; font-weight: 500;
    color: var(--text);
    letter-spacing: -0.15px;
    position: relative;
  }
  .ctx-item:active { background: rgba(127,127,127,0.14); }
  .ctx-item.danger { color: #ff3b30; }
  .ctx-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
  .ctx-sep { height: 1px; background: var(--hairline); margin: 4px 10px; }

  #chat-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  #chat-screen.hidden { display: none; }
  .topbar {
    display: grid; grid-template-columns: 52px 1fr 52px;
    align-items: center; gap: 12px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    z-index: 10;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
  }
  .icon-btn:active { transform: scale(.93); }
  .chat-title {
    text-align: center; font-size: 16px; font-weight: 600;
    color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .chat-title-dot {
    width: 28px; height: 28px;
    animation: cardDotBounce 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  .chat-title-dot img { width: 100%; height: 100%; object-fit: contain; }

  #screen { flex: 1; overflow-y: auto; padding: 8px 16px 160px 16px; -webkit-overflow-scrolling: touch; }
  .welcome {
    min-height: 45vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 18px; color: var(--text-mute);
    padding: 20px;
  }
  .welcome .logo { width: 62px; height: 62px; color: var(--text); opacity: .9; }
  .welcome .dot-hero {
    width: 120px; height: 120px;
    animation: dotHero 2.6s ease-in-out infinite;
  }
  .welcome .dot-hero img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes dotHero {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .welcome h1 {
    font-size: 19px; font-weight: 500; line-height: 1.4;
    margin: 0; max-width: 320px; color: var(--text-dim); letter-spacing: -0.3px;
  }
  .welcome-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; max-width: 340px;
  }

  #messages { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  .msg {
    max-width: 86%; padding: 12px 16px; border-radius: 22px;
    line-height: 1.5; font-size: 15px;
    word-wrap: break-word;
    animation: msgIn .22s cubic-bezier(.2,.9,.3,1);
    letter-spacing: -0.15px;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .user {
    align-self: flex-end; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    border-bottom-right-radius: 8px;
    box-shadow: 0 2px 10px rgba(10,10,10,0.15);
    white-space: pre-wrap;
  }
  html.dot-mode .user {
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--dot-color) 60%, #000) 0%,
      var(--dot-color) 100%);
    color: #1a1a1a;
  }
  .bot {
    align-self: flex-start; color: var(--text);
    background: var(--bot-bg);
    border-bottom-left-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid var(--hairline);
  }
  .msg a { color: #0a84ff; text-decoration: none; }
  .msg .src {
    display: block; margin-top: 8px; font-size: 12px;
    color: var(--text-mute); line-height: 1.4;
  }
  .msg b, .msg strong { font-weight: 700; }
  .msg i, .msg em { font-style: italic; }
  .msg code {
    background: rgba(127,127,127,0.15);
    padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .msg pre {
    background: rgba(127,127,127,0.12);
    padding: 12px; border-radius: 12px;
    overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px; line-height: 1.5;
    margin: 8px 0;
  }
  .msg pre code { background: none; padding: 0; }
  .msg ul, .msg ol { padding-left: 22px; margin: 8px 0; }
  .msg li { margin: 4px 0; }
  .msg h1, .msg h2, .msg h3 { margin: 12px 0 6px; line-height: 1.2; letter-spacing: -0.4px; }
  .msg h1 { font-size: 20px; }
  .msg h2 { font-size: 17px; }
  .msg h3 { font-size: 15.5px; }
  .msg blockquote {
    border-left: 3px solid var(--dot-color, #0071e3);
    padding: 4px 0 4px 12px;
    margin: 8px 0;
    color: var(--text-dim);
  }
  .msg hr { border: none; height: 1px; background: var(--hairline); margin: 12px 0; }

  .expand-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 14px;
    background: rgba(127,127,127,0.10);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text); cursor: pointer;
    font-family: inherit;
  }
  .expand-btn:active { transform: scale(.97); }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--chip-bg);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text); cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .chip:active { transform: scale(.96); }
  .wiki-img-wrap {
    display: inline-block; margin: 4px 0 10px 0;
    border-radius: 14px; overflow: hidden;
    background: #eef0f3; line-height: 0;
    max-width: 220px;
  }
  .wiki-img {
    display: block; max-width: 100%; max-height: 220px;
    width: auto; height: auto;
    opacity: 0; transition: opacity .3s; cursor: pointer;
  }
  .wiki-img.loaded { opacity: 1; }
  .qr-wrap {
    display: inline-block; margin: 8px 0;
    padding: 10px; background: #ffffff;
    border-radius: 12px;
  }
  .qr-wrap img { display: block; width: 180px; height: 180px; }
  .timer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    background: var(--chip-bg);
    border-radius: 16px;
    font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 18px;
  }
  .timer-badge.done { color: #ff3b30; }
  .cursor {
    display: inline-block; width: 7px; height: 15px;
    background: var(--text); margin-left: 2px; vertical-align: -2px;
    animation: blink .9s steps(2,start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .dots-anim span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    background: #c0c0c5; border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots-anim span:nth-child(2){ animation-delay: .15s; }
  .dots-anim span:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:.5; }
    30% { transform: translateY(-4px); opacity:1; }
  }
  .status-line {
    font-size: 13px; color: var(--text-mute);
    padding: 4px 2px; display: flex; align-items: center; gap: 8px;
  }
  .status-line .spin {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #d8d8dc; border-top-color: var(--text);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .uploaded-img {
    display: block; max-width: 180px; max-height: 180px;
    border-radius: 14px; margin-top: 6px; object-fit: cover;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom));
    padding: 10px 18px;
    background: rgba(20,20,22,0.92);
    color: #fff;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    z-index: 400;
    animation: toastIn .22s cubic-bezier(.2,.9,.3,1.1);
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .composer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, transparent);
    z-index: 10;
  }
  .pill {
    display: flex; align-items: center; gap: 8px;
    border-radius: 999px;
    padding: 6px 6px 6px 12px;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .pill-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); flex-shrink: 0;
    font-size: 19px; font-weight: 500;
  }
  .pill-btn:active { background: rgba(127,127,127,0.15); }
  .pill-btn.at-btn {
    width: 36px; height: 36px;
    font-size: 26px; font-weight: 500;
    color: var(--text); line-height: 1; padding: 0;
  }
  .pill-btn.at-btn.active { color: #0a84ff; }
  .pill-btn.mic-btn.recording { color: #ff3b30; animation: pulseRec 1s infinite; }
  @keyframes pulseRec { 50% { transform: scale(1.15); } }
  #input {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 16px; line-height: 1.3; max-height: 90px;
    font-family: inherit; color: var(--text); background: transparent;
    padding: 6px 0; min-width: 0;
  }
  #input::placeholder { color: var(--text-mute); }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    opacity: .4;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
  }
  html.dot-mode .send-btn { background: var(--dot-color); color: #1a1a1a; }
  .send-btn.visible { opacity: 1; }
  .send-btn:active { transform: scale(.94); }
  .send-btn.stop { background: #ff3b30; opacity: 1; }
  .char-counter {
    font-size: 11px; color: var(--text-mute);
    padding: 0 4px; flex-shrink: 0;
    opacity: 0; transition: opacity .15s;
  }
  .char-counter.visible { opacity: 1; }
  .cmd-panel {
    position: fixed; left: 14px; right: 14px;
    bottom: calc(90px + env(safe-area-inset-bottom));
    border-radius: 20px; padding: 8px;
    z-index: 20; max-height: 55vh; overflow-y: auto;
    display: none;
    background: var(--card);
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.14);
    animation: popFromBottom .2s ease;
  }
  .cmd-panel.visible { display: block; }
  .cmd-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 14px;
    cursor: pointer;
  }
  .cmd-item:active { background: rgba(127,127,127,0.12); }
  .cmd-code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 600; color: var(--text);
    background: rgba(127,127,127,0.12);
    padding: 3px 9px; border-radius: 8px;
    font-size: 12px; flex-shrink: 0;
    min-width: 60px; text-align: center;
  }
  .cmd-desc { font-size: 13px; color: var(--text-dim); line-height: 1.3; }

  .sheet-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.28);

/* В JS \b не работает с кириллицей — пересобираем регулярки с Unicode-границами */
Object.values(DOTS_CLASSES).forEach(c => {
  if (c.style) c.style = c.style.map(([re, r]) => [
    new RegExp(re.source.replace(/^\\b/, '(?<![\\p{L}\\p{N}])').replace(/\\b$/, '(?![\\p{L}\\p{N}])'), 'giu'), r ]);
  if (c.trigger) c.trigger = new RegExp('(?<![\\p{L}\\p{N}])' + c.trigger.source, 'iu');
});
function applyDotStyle(text, classId){
  const cls = DOTS_CLASSES[classId];
  if (!cls || !cls.style) return String(text);
  return String(text).split(/(<[^>]+>)/).map(part => part.charAt(0) === "<" ? part :
    cls.style.reduce((acc, [re, r]) => acc.replace(re, r), part)).join("");
}
function applyDotToText(html){
  const dot = getDotFor(replyChatId || currentChatId);
  if (!dot) return html;
  return applyDotStyle(html, dot.classId);
}
function maybeDotFlavor(classId){
  const cls = DOTS_CLASSES[classId];
  if (!cls) return "";
  const chance = classId === "froggy" ? 0.5 : classId === "pinky" ? 0.35 : 0.15;
  if (Math.random() > chance) return "";
  if (classId === "pinky" && cls.songLines && Math.random() < 0.5) return " " + pick(cls.songLines) + ".";
  if (cls.jokes && cls.jokes.length) return " " + pick(cls.jokes);
  return "";
}

const DOT_CLASS_KEYWORDS = {
  teach: ["учёб","учеб","наук","матем","физик","хими","биолог","истор","литер","факт","информац","знани","образован","школ","студент","исслед","анализ"],
  pinky: ["музык","творч","пев","песн","артист","дизайн","искусств","стих","поэз","танец","стил","мода","вдохнов","эмоц","чувств","вайб","чарт","тренд"],
  dro: ["визуал","рисов","рисунк","дизайн","картин","фото","стил","изображ","цвет","форм","арт","график","иллюстр","скетч"],
  froggy: ["мем","шутк","юмор","весел","смешн","наук","хими","биолог","эксперимент","опыт","лаб","географ","стран"],
};
function detectDotClass(text){
  const lower = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const [id, kws] of Object.entries(DOT_CLASS_KEYWORDS)){
    let score = 0;
    for (const kw of kws){ if (lower.includes(kw)) score += kw.length; }
    if (score > bestScore){ bestScore = score; best = id; }
  }
  return best || "teach";
}

function buildDonorHistory(userText){
  const chat = getChat(replyChatId || currentChatId);
  if (!chat) return [];
  let msgs = chat.messages.slice(-7);
  if (msgs.length && msgs[msgs.length-1].who === "user" && msgs[msgs.length-1].text === userText) msgs = msgs.slice(0, -1);
  return msgs.slice(-6).map(m => ({
    role: m.who === "user" ? "user" : "assistant",
    content: m.text.replace(/<[^>]+>/g, "").slice(0, 500),
  }));
}

async function askDonor(userText){
  const dot = getDotFor(replyChatId || currentChatId);
  const tone = {
    teach: "Ты Тич — умный помощник по учёбе. Отвечай точно, по фактам.",

  };

  if (dot){ sys += " " + (tone[dot.classId] || ""); if (dot.sphere) sys += " Твоя сфера: " + dot.sphere + "."; }
  const messages = [{ role: "system", content: sys }, ...buildDonorHistory(userText), { role: "user", content: userText }];
  const run = async (fn) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 20000);
    try { return await fn(c.signal); } finally { clearTimeout(t); } };
  try {
    return await run(async (signal) => {
      const res = await fetch("https://text.pollinations.ai/openai", { method: "POST", signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "openai", messages, temperature: 0.8, max_tokens: 700 }) });
      if (!res.ok) throw 0;
      const d = await res.json();
      const c = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (!c || !c.trim()) throw 0;
      return c.trim();
    });
  } catch (e) {}
  try {
    return await run(async (signal) => {
      const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(userText.slice(0, 1500)) +
        "?model=openai&system=" + encodeURIComponent(sys), { signal });
      if (!res.ok) throw 0;
      const t = (await res.text()).trim();
      if (!t) throw 0;
      return t;
    });
  } catch (e) { return null; }
}

/* ============================================================
   MARKDOWN → HTML
   ============================================================ */
function markdownToHtml(md){
  if (!md) return "";
  let html = escapeHtml(md);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => '<pre><code>' + code.trim() + '</code></pre>');
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^\*\n]+)\*\*/g, '<b>$1</b>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  html = html.replace(/(?<![\d\/])(\d+)\/(\d+)(?![\d\/])/g,
    '<span class="fraction"><span class="num">$1</span><span class="den">$2</span></span>');
  html = html.replace(/\n\n+/g, '<br><br>');
  html = html.replace(/([^>])\n([^<])/g, '$1<br>$2');
  return html;
}

function initTheme(){
  let saved = ls.get(THEME_KEY);
  if (saved === null){
    const preferDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    saved = preferDark ? "dark" : "light";
    ls.set(THEME_KEY, saved);
  }
  applyTheme(saved === "dark");
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function sanitizeHtml(html){
  const t = document.createElement("template"); t.innerHTML = String(html);
  t.content.querySelectorAll("script,style,iframe,object,embed,link,meta,base,form").forEach(n => n.remove());
  t.content.querySelectorAll("*").forEach(n => { [...n.attributes].forEach(a => {
    const nm = a.name.toLowerCase();
    if (nm.startsWith("on") || (["href","src","xlink:href"].includes(nm) && /^\s*(javascript|data:text|vbscript)/i.test(a.value))) n.removeAttribute(a.name);
  }); });
  return t.innerHTML;
}
/* Свои диалоги вместо confirm/prompt (в песочницах они молча не работают) */
function uiDialog(o){
  return new Promise(resolve => {
    const ov = document.createElement("div"); ov.className = "ctx-overlay visible";
    ov.innerHTML = '<div class="ctx-menu dlg"><div class="dlg-title"></div>' + (o.text ? '<div class="dlg-text"></div>' : '') +
      (o.input !== undefined ? '<input class="dlg-input" maxlength="60">' : '') +
      '<div class="dlg-actions"><button class="dlg-btn" data-r="0">Отмена</button><button class="dlg-btn ' + (o.danger ? 'danger' : 'primary') + '" data-r="1"></button></div></div>';
    ov.querySelector(".dlg-title").textContent = o.title || "";
    if (o.text) ov.querySelector(".dlg-text").textContent = o.text;
    ov.querySelector('[data-r="1"]').textContent = o.ok || "ОК";
    const inp = ov.querySelector(".dlg-input"); if (inp) inp.value = o.input;
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener("click", e => { if (e.target === ov) close(null); });

    ov.querySelector('[data-r="1"]').onclick = () => close(inp ? inp.value : true);
    if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") close(inp.value); });

  });
}

function dateLabel(ts){
  const d = new Date(ts), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that) / 86400000);
  if (diff === 0) return "Сегодня";
  if (diff === 1) return "Вчера";
  const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  return d.getDate()+" "+months[d.getMonth()];
}

async function fetchWikipedia(query, full){
  const clean = query
    .replace(/^(что такое|кто такой|кто такая|кто такие|расскажи про|расскажи о|расскажи об|объясни|объясните|поясни|растолкуй|что значит|определение|что означает|что за)\s+/i, "")
    .replace(/[?!.]+$/,"").trim();
  if (!clean || clean.length > 120) return null;
  const getPage = async (lang, title) => {
    try {
      const exIntro = full ? "" : "&exintro=1";
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
        `&prop=extracts|info|pageimages&inprop=url&explaintext=1&redirects=1`+
        `&piprop=thumbnail|name&pithumbsize=500`+exIntro+
        `&titles=${encodeURIComponent(title)}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data.query && data.query.pages;
      if (!pages) return null;
      const page = Object.values(pages)[0];
      if (!page || !page.extract || page.extract.length < 20) return null;
      let image = null;
      if (page.thumbnail && page.thumbnail.source){
        image = page.thumbnail.source;
        if (/\.svg$/i.test(image)) image = null;
      }
      return { title: page.title, extract: page.extract,
        url: page.fullurl || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`,
        lang, image };
    } catch { return null; }
  };
  const search = async (lang, q) => {
    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const hit = data.query && data.query.search && data.query.search[0];
      return hit ? hit.title : null;
    } catch { return null; }
  };
  for (const lang of ["ru","en"]){
    let r = await getPage(lang, clean);
    if (r) return r;
    const found = await search(lang, clean);
    if (found){ r = await getPage(lang, found); if (r) return r; }
  }
  return null;
}
function cleanWikiText(text){
  return text
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F2FF}\u{FE0F}\u{200D}]/gu, "")
    .replace(/\s*\([^)]*\)/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}
function shortenWiki(text, maxLen){
  maxLen = maxLen || 500;
  let t = cleanWikiText(text).replace(/\s+/g," ").trim();
  if (t.length <= maxLen) return t;
  const cut = t.slice(0, maxLen);
  const lastDot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (lastDot > 180) return cut.slice(0, lastDot+1);
  return cut.trim() + "…";
}

function cityForms(n){

/* ============================================================
   МАТЕМАТИКА
   ============================================================ */
function safeMath(expr){
  if (!/^[\d+\-*/().\s^%]+$/.test(expr)) return null;
  let js = expr.replace(/\^/g,"**");
  try {
    const t = tokenize(js); const r = parseExpr(t);
    if (t.length) return null;
    if (typeof r!=="number" || !isFinite(r)) return null;
    return r;
  } catch { return null; }
}
function tokenize(s){
  const re = /\s*(\d+\.?\d*|\*\*|[+\-*/()%])/g; const out=[]; let m,last=0;
  while ((m=re.exec(s))) { if (m.index!==last) throw 0; out.push(m[1]); last=re.lastIndex; }
  if (last!==s.length) throw 0;
  return out;
}
function parseExpr(t){ let l=parseTerm(t); while (t[0]==="+"||t[0]==="-"){ const o=t.shift(); const r=parseTerm(t); l = o==="+"?l+r:l-r;} return l; }
function parseTerm(t){ let l=parsePow(t); while (t[0]==="*"||t[0]==="/"||t[0]==="%"){ const o=t.shift(); const r=parsePow(t); if(o==="*")l*=r; else if(o==="/")l/=r; else l%=r;} return l; }
function parsePow(t){ let b=parseFactor(t); if(t[0]==="**"){ t.shift(); const e=parsePow(t); return Math.pow(b,e);} return b; }
function parseFactor(t){
  const tok=t.shift();
  if (tok==="("){ const v=parseExpr(t); if(t.shift()!==")") throw 0; return v; }
  if (tok==="-") return -parseFactor(t);
  if (tok==="+") return parseFactor(t);
  const n=Number(tok); if (isNaN(n)) throw 0; return n;
}
function fmt(n){ return Number.isInteger(n) ? n : +n.toFixed(6); }
function extractMath(text){
  const m = text.match(/[-+]?\d[\d\s+\-*/().^%]*\d|[-+]?\d/);
  return m ? m[0].trim() : null;
}

    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && Array.isArray(imported.messages)){
            const valid = !!DOTS_CLASSES[imported.dotClass];
            const clean = {
              id: "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
              title: String(imported.title || "Импорт").slice(0, 60), preview: String(imported.preview || "").slice(0, 100),
              createdAt: Date.now(), updatedAt: Date.now(),
              messages: imported.messages.filter(m => m && typeof m.text === "string").map(m => ({
                who: m.who === "user" ? "user" : "bot", text: m.who === "user" ? m.text : sanitizeHtml(m.text), ts: Number(m.ts) || Date.now() })),
              dotClass: valid ? imported.dotClass : null, dotName: valid && imported.dotName ? String(imported.dotName).slice(0, 24) : null,
              dotDesc: null, dotImg: null, dotColor: null, dotColorSoft: null, dotSphere: null,
            };
            const chats = loadChats(); chats.unshift(clean); saveChats(chats);
            renderHome(); showToast("Импортирован");
          } else showToast("Неверный формат файла");
        } catch (err) { showToast("Ошибка импорта"); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
}

function finishStream(){
  if (!activeStream) return;
  const st = activeStream; activeStream = null;
  if (streamTimer){ clearInterval(streamTimer); streamTimer = null; }
  if (st.cursor) st.cursor.remove();
  st.el.innerHTML = st.fullText; st.el.dataset.streaming = "0";
  isStreaming = false; updateSendBtn();
  if (st.el.isConnected) scrollBottom();
  if (st.done) st.done();
}
function streamText(el, fullText, done){
  finishStream();
  el.dataset.full = fullText; el.dataset.streaming = "1"; el.textContent = "";
  const plainLen = fullText.replace(/<[^>]+>/g,"").length;
  if (plainLen > 700 || /<img/i.test(fullText) || !el.isConnected){   /* длинное / с картинкой / чат закрыт — сразу */
    activeStream = { el, fullText, done }; finishStream(); return;
  }
  isStreaming = true; updateSendBtn();
  const tokens = []; const re = /(<[^>]+>|[\s\S])/g; let m;
  while ((m = re.exec(fullText))) tokens.push(m[1]);
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.appendChild(cursor);
  activeStream = { el, fullText, done, cursor };
  const speed = plainLen > 200 ? 14 : (plainLen > 80 ? 20 : 28);
  const step = plainLen > 200 ? 4 : (plainLen > 80 ? 2 : 1);
  let i = 0;
  streamTimer = setInterval(()=>{
    if (!activeStream || activeStream.el !== el){ clearInterval(streamTimer); return; }
    if (!el.isConnected){ finishStream(); return; }
    let emitted = 0;
    while (i < tokens.length && emitted < step){
      const tk = tokens[i++];
      if (tk.charAt(0) === "<" && tk.length > 1){
        const span = document.createElement("span"); span.innerHTML = tk;
        while (span.firstChild) el.insertBefore(span.firstChild, cursor);
      } else { cursor.insertAdjacentText("beforebegin", tk); emitted++; }
    }
    scrollBottom();
    if (i >= tokens.length) finishStream();
  }, speed);
}

function generateTitle(text){
  let t = text.trim().replace(/^@\w+\s*/i, "").trim();
  const words = t.replace(/[?!.,;:]+/g, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "Новый чат";
  let title = words.slice(0, 4).join(" ");
  if (title.length > 36) title = title.slice(0, 33) + "…";
  return title.charAt(0).toUpperCase() + title.slice(1);
}

        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);

      showToast("Таймер завершён");
      persistMessage("bot", "Таймер на " + label + " завершён", cid);
      updatePreviewFromLastBot();

async function handleWeather(city){
  const statusEl = addStatus("Смотрю погоду в «"+city+"»...");
  const local = describeWeatherLocal(city);
  try {
    let real = null; for (const f of cityForms(city).slice(0, 3)){ real = await fetchRealWeather(f); if (real) break; }
    statusEl.remove();
    if (real){
      memory.lastCity = real.name.toLowerCase();
      if (!memory.citiesSeen.includes(real.name.toLowerCase())) memory.citiesSeen.push(real.name.toLowerCase());
      const desc = wmoToText(real.code);
      const word = real.temp > 15 ? "тепло" : (real.temp < 0 ? "холодно" : "прохладно");
      const place = real.country ? real.name+", "+real.country : real.name;
      const html = "<b>Погода: "+place+"</b><br><br>Сейчас "+desc+", "+real.temp+"°C. "+word.charAt(0).toUpperCase()+word.slice(1)+". Ветер "+real.wind+" м/с.";
      const botEl = addMsg("", "bot");
      streamText(botEl, html, ()=>{ persistMessage("bot", html); updatePreviewFromLastBot(); });
      return;
    }
    if (local){
      memory.lastCity = resolveCity(city);
      const botEl = addMsg("", "bot");
      streamText(botEl, local, ()=>{ persistMessage("bot", local); updatePreviewFromLastBot(); });
      return;
    }
    const msg = "Не нашёл город.";
    const botEl = addMsg("", "bot");
    streamText(botEl, msg, ()=>{ persistMessage("bot", msg); updatePreviewFromLastBot(); });
  } catch(e){
    statusEl.remove();
    const botEl = addMsg("", "bot");
    streamText(botEl, local || "Не удалось.", ()=>{ persistMessage("bot", local || "Не удалось."); updatePreviewFromLastBot(); });
  }
}

const WEATHER_WORDS = ["погод","температур","дожд","снег","солнечн","облачн","тепл","холодн","ветрен"];
function extractCity(text){
  const stop = /^(сегодня|завтра|сейчас|мире|целом|общем|этом|моем|моём)$/i;
  let m = text.match(/(?:^|[^\p{L}])(?:в|во|для)\s+([\p{L}][\p{L}\-]+)/iu);
  if (m && !stop.test(m[1])) return m[1];
  m = text.match(/погода\s+([\p{L}][\p{L}\-]+)/iu);
  if (m && !stop.test(m[1])) return m[1];
  const words = text.replace(/[?!.,]/g,"").split(/\s+/);
  for (const w of words){ if (WEATHER_DB[resolveCity(w)]) return w; }
  return null;
}

function botReplySync(raw){
  let text = raw.trim();
  if (!text) return null;
  const lower = text.toLowerCase().replace(/ё/g,"е");
  const dot = getCurrentDot();
  const dotClass = dot ? dot.classId : null;

  /* Приветствие */
  if (lower.length <= 40 && /^(привет|здравств|хай|hi|hello|добрый|салют|ку|прив|приветик|доброе\s+утро|добрый\s+день|добрый\s+вечер|йо|нихао|хеллоу|приветствую|здарова|здорово)(?![\p{L}\p{N}])/iu.test(lower)){
    if (dot){
      const greetings = {
        teach: "Привет. Я "+dot.name+". Готов объяснять, искать факты и считать.",
        pinky: "Хей! Я Пинки. Давай про музло, вайб или что-то эстетичное.",
        dro: "Привет. Я Дро. Помогу с визуалом, нарисую что-нибудь.",
        froggy: "Йо! Я Фрогги. Погнали в нишевую науку — только с мемами.",
      };
      return { text: greetings[dot.classId] || greetings.teach };
    }
    return { text: "Привет! Я check. Могу искать информацию, считать, проверять текст, переводить, генерировать картинки. С чего начнём?" };
  }

  /* @команды */
  const cmdMatch = text.match(/^@(teach|wiki|weather|math|gdz|help|fix|img|tr|qr|timer|define|quote)\b\s*(.*)$/i);
  if (cmdMatch){
    const cmd = cmdMatch[1].toLowerCase();
    const rest = cmdMatch[2].trim();
    if (cmd === "help") return { text: "Команды: @teach, @wiki, @fix, @tr, @math, @img, @qr, @timer, @gdz, @weather" };
    if (cmd === "fix"){ if (!rest) return { text: "Напиши текст после @fix." }; return { async: "fix", query: rest }; }
    if (cmd === "tr"){ if (!rest) return { text: "Напиши текст после @tr." }; const hasCyr = /[а-яё]/i.test(rest); return { async: "translate", query: rest, from: hasCyr ? "ru" : "en", to: hasCyr ? "en" : "ru" }; }
    if (cmd === "qr"){ if (!rest) return { text: "Напиши текст после @qr." }; return { async: "qr", query: rest }; }
    if (cmd === "timer"){
      if (!rest) return { text: "Например: @timer 5м" };
      const m = rest.match(/(\d+)\s*(с|сек|м|мин|ч|час)/i);
      if (!m) return { text: "Пример: @timer 5м" };
      const n = parseInt(m[1]); const unit = m[2].toLowerCase();
      let secs = n;
      if (unit.startsWith("м") || unit.startsWith("min")) secs = n * 60;
      if (unit.startsWith("ч") || unit.startsWith("час")) secs = n * 3600;
      if (secs < 1) return { text: "Укажи время больше нуля." };
      if (secs > 3600) return { text: "Слишком долго." };
      return { async: "timer", seconds: secs, label: n + (unit.startsWith("с") ? " сек" : unit.startsWith("м") ? " мин" : " ч") };
    }
    if (cmd === "quote") return { text: "«Единственный способ делать великую работу — любить то, что делаешь». — Стив Джобс" };
    if (cmd === "weather"){
      if (rest) return { async: "weather", city: rest };
      memory.state.awaiting = { kind: "city" };
      return { text: "Погоду в каком городе?" };
    }
    if (cmd === "math"){ if (rest) return { async: "wolfram", query: rest }; return { text: "Напиши выражение." }; }
    if (cmd === "img"){ if (!rest) return { text: "Опиши картинку." }; return { async: "image", query: rest }; }
    if (cmd === "gdz"){
      const numMatch = text.match(/(?:номер|№|задани[ея]|упражнени[ея])\s*(\d+)/i);
      const gradeMatch = lower.match(/(\d{1,2})\s*класс/i);
      const subjectMatch = lower.match(/(алгебр|геометр|матем|физик|хими|биологи|русск|литератур|английск|истори|географи|информатик|обществ)/i);
      return { async: "gdz", query: {
        num: numMatch ? numMatch[1] : null,
        grade: gradeMatch ? gradeMatch[1] : null,
        subject: subjectMatch ? subjectMatch[1] : null,
        author: null,
      }};
    }
    if (cmd === "teach" || cmd === "wiki"){
      if (!rest) return { text: "Напиши запрос." };
      return { async: "search", query: rest, full: cmd === "teach" };
    }
  }

  /* Ожидание города */
  if (memory.state.awaiting && memory.state.awaiting.kind === "city"){
    const c = text.trim().replace(/[?!.]+$/,"");
    if (c.length >= 2 && c.length <= 40){
      memory.state.awaiting = null;
      return { async: "weather", city: c };
    }
    memory.state.awaiting = null;
  }

  /* Знакомство */
  const nameMatch = lower.match(/меня зовут\s+([а-яёa-z\-]+)/i);
  if (nameMatch){
    memory.userName = nameMatch[1].charAt(0).toUpperCase()+nameMatch[1].slice(1);
    return { text: "Приятно познакомиться, "+memory.userName+"!" };
  }

  /* Кто ты */
  if (/(кто ты|ты кто|как тебя зовут)/i.test(lower)){
    if (dot) return { text: "Я " + dot.name + ". " + dot.desc };
    return { text: "Я check — быстрый российский ИИ." };
  }

  /* Как дела */
  if (/(как дела|как ты|как жизнь|как настроение)/i.test(lower)){
    if (dotClass === "pinky") return { text: "Всё вайбово! А у тебя как?" };
    if (dotClass === "froggy") return { text: "Нишево! А ты как, челик?" };
    return { text: "У меня всё отлично! А у тебя как?" };
  }

  /* Что умеешь */
  if (/(что ты умеешь|помощь|help|команды|что можешь)/i.test(lower)){
    return { text: "Могу: искать, объяснять, считать, проверять текст, переводить, генерировать картинки, ставить таймер, искать ГДЗ, показывать погоду. Команды: @help" };
  }

  /* Погода */
  if (WEATHER_WORDS.some(w=>lower.includes(w))){
    const city = extractCity(text);
    if (city) return { async: "weather", city };
    memory.state.awaiting = { kind: "city" };
    return { text: "Погоду в каком городе?" };
  }

  /* Простая математика */
  let m = lower.match(/(\d+\.?\d*)\s*%\s*(от|of)\s*(\d+\.?\d*)/);
  if (m){
    const p = parseFloat(m[1]), n = parseFloat(m[3]);
    return { text: fmt(p)+"% от "+fmt(n)+" = "+fmt(p*n/100)+"." };
  }
  m = lower.match(/√\s*(\d+\.?\d*)/);
  if (m) return { text: "√"+m[1]+" = "+fmt(Math.sqrt(parseFloat(m[1]))) };
  const mathText = text.replace(/×/g,"*").replace(/÷/g,"/").replace(/(\d),(\d)/g,"$1.$2");
  const mathExpr = extractMath(mathText);
  const mathLetters = mathText.replace(/[\d\s+\-*\/().^%=?,]/g,"").length;
  if (mathExpr && mathLetters <= 12 && !/\d+[-.\/]\d+[-.\/]\d+/.test(mathExpr) && /[+\-*/^%]/.test(mathExpr)){
    const val = safeMath(mathExpr);
    if (val !== null) return { text: mathExpr + " = " + fmt(val) + "." };
  }

  const drawM = text.match(/^(?:нарисуй|изобрази)\s+(.+)/iu);
  if (drawM) return { async: "image", query: drawM[1].trim() };
  /* Картинки */
  if (/(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк|изображени|фото|рисунок|арт)/i.test(lower)){
    const prompt = text.replace(/^(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк[уи]?|изображени[ея]?|фото|рисунок|арт)\s*/i, "").trim();
    return { async: "image", query: prompt || "красивый пейзаж" };
  }

  /* Сложная математика → Wolfram */
  if (/(интеграл|производн|уравнени|матриц|предел)/i.test(lower)){
    return { async: "wolfram", query: text };
  }

  /* Благодарность / прощание — локально */
  if (/^(спасибо|благодарю|спс|thanks|thx)/iu.test(lower)) return { text: pick(["Пожалуйста!","Рад помочь!","Обращайся."]) };
  if (/^(пока|до свидания|удачи|bye)(?![\p{L}])/iu.test(lower)) return { text: "Пока! Заходи ещё." };
  if (/^(реши|решить)(\s+(задачу|задача|пример))?\s*$/iu.test(lower)) return { text: "Пришли условие — и я решу." };

  /* Шутки / факты / цитаты — локально */
  if (/(шутк|анекдот|рассмеши|пошути|смешн)/i.test(lower)){
    if (dot){
      const cls = DOTS_CLASSES[dot.classId];
      if (cls && cls.jokes && cls.jokes.length) return { text: applyDotToText(pick(cls.jokes)) };
    }
    return { text: "Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 == DEC 25." };
  }
  if (/(факт|интересное|расскажи что-нибудь|удиви)/i.test(lower)){
    if (dot){
      const cls = DOTS_CLASSES[dot.classId];
      if (cls && cls.facts && cls.facts.length) return { text: applyDotToText(pick(cls.facts)) + applyDotToText(maybeDotFlavor(dot.classId)) };
    }
    return { text: "Мёд не портится: археологи находили съедобный мёд в гробницах возрастом 3000 лет." };
  }
  if (/(цитат|мотивир|вдохнови)/i.test(lower)){
    return { text: "«Простота — высшая форма изысканности». — Леонардо да Винчи" };
  }

  const words = text.split(/\\s+/).length;
  const complex = isComplexQuery(text);

  /* Дотс отвечает ЛОКАЛЬНО по своей сфере (короткие реплики) */
  if (dot && DOTS_CLASSES[dot.classId] && words <= 6 && !complex){
    const cls = DOTS_CLASSES[dot.classId];
    if ((cls.trigger && cls.trigger.test(lower)) || sphereHit(dot, lower)){
      return { text: applyDotToText(pick(cls.facts)) + applyDotToText(maybeDotFlavor(dot.classId)) };
    }
  }

  /* Простой поиск знаний → Википедия */
  const simpleWikiMatch = text.match(/^(?:кто такой|кто такая|что такое|расскажи про|расскажи о|кто такие)\\s+(.+?)[?!.]*$/i);
  if (simpleWikiMatch && simpleWikiMatch[1].trim().length >= 2 && simpleWikiMatch[1].trim().length <= 60){
    return { async: "searchOrAsk", query: simpleWikiMatch[1].trim() };
  }

  /* Сложное — единственный случай, когда сразу идём во внешний ИИ */
  if (complex) return { async: "donor", query: text };

  /* Объяснения: Википедия, не нашлось — ИИ */
  if (/(объясни|почему|как работает|что будет если|зачем)/i.test(lower)){
    const query = text.replace(/^(объясни|почему|как работает|зачем)\\s+/i, "").trim();
    if (query.length > 2 && query.length < 80) return { async: "searchOrDonor", query };
    return { async: "donor", query: text };
  }

  /* Короткая фраза без вопроса — возможно, это термин: пробуем Википедию */
  if (words <= 3 && text.length <= 30 && !/[?]$/.test(text)) return { async: "searchOrAsk", query: text };

  /* Остальное: честно говорим, что не знаем, и предлагаем ИИ кнопкой */
  return { askAi: true };
}
function isComplexQuery(t){
  return t.length > 90 || t.split(/[.!?]\\s/).length > 2 ||
    /(напиши|сочини|эссе|сочинение|реферат|придумай|составь|распиши|проанализируй|сравни|перепиши|код на|программ|алгоритм|функци|реши|решить|задач[ауи]|докажи|вычисли|как сделать|как лучше|посоветуй|подробно|пошагово)/iu.test(t);
}

   SEND
   ============================================================ */
function send(){
  const text = inputEl.value.trim();
  if (!text || !currentChatId) return;
  replyChatId = currentChatId;
  if (welcomeEl) welcomeEl.style.display = "none";
  cmdPanel.classList.remove("visible");
  atBtn.classList.remove("active");
  lastActivityAt = Date.now();
  addMsg(text, "user");
  persistMessage("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  charCounter.classList.remove("visible");
  updateSendBtn();

  const reply = botReplySync(text);
  if (!reply) return;

  if (reply.async === "search"){
    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      const ok = await handleSearch(reply.query, { full: reply.full });
      if (!ok) showAskAi(reply.query, "В Википедии ничего не нашлось.");
    }, 300);
    return;
  }
  if (reply.async === "searchOrAsk"){
    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      const ok = await handleSearch(reply.query);
      if (!ok) showAskAi(text, "В Википедии ничего не нашлось.");
    }, 300);
    return;
  }
  if (reply.askAi){
    showTypingIndicator();
    setTimeout(()=>{ hideTypingIndicator(); showAskAi(text, "Не уверен, что понял вопрос."); }, 300 + Math.random()*300);
    return;
  }
  if (reply.async === "searchOrDonor"){
    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      const ok = await handleSearch(reply.query);
      if (!ok) await handleDonor(text);
    }, 300);
    return;
  }
  if (reply.async === "donor"){
    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      await handleDonor(reply.query);
    }, 300);
    return;
  }
  if (reply.async === "fix"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleFix(reply.query); }, 300); return; }
  if (reply.async === "translate"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleTranslate(reply.query, reply.from, reply.to); }, 300); return; }
  if (reply.async === "qr"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleQr(reply.query); }, 300); return; }
  if (reply.async === "timer"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleTimer(reply.seconds, reply.label); }, 300); return; }
  if (reply.async === "gdz"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleGdz(reply.query); }, 400); return; }
  if (reply.async === "wolfram"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleWolfram(reply.query); }, 400); return; }
  if (reply.async === "image"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleImage(reply.query); }, 400); return; }
  if (reply.async === "weather"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleWeather(reply.city); }, 300); return; }

  if (!reply.text || !reply.text.trim()) return;
  showTypingIndicator();
  setTimeout(()=>{
    hideTypingIndicator();
    const botEl = document.createElement("div");
    botEl.className = "msg bot";
    if (isViewing()) messagesEl.appendChild(botEl);
    let textHtml = applyDotToText(reply.text);
    streamText(botEl, textHtml, ()=>{
      persistMessage("bot", textHtml);
      updatePreviewFromLastBot();
    });
  }, 300 + Math.random()*400);
}

function showSheet(html){
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay visible";
  overlay.id = "sheet-overlay";
  overlay.innerHTML = '<div class="sheet">' + html + '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if (e.target === overlay) closeSheet(); });
  return overlay.querySelector(".sheet");
}
function closeSheet(){
  const el = document.getElementById("sheet-overlay");
  if (el) el.remove();
}

    chip.addEventListener("click", ()=>{
      content.querySelectorAll(".field-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      sphereInput.value = chip.dataset.sphere;
    });
  });
  content.querySelector("#dot-create-btn").addEventListener("click", ()=>{
    const name = nameInput.value.trim() || "Dots";
    const sphere = sphereInput.value.trim() || "помощник на все случаи";
    const classId = detectDotClass(sphere + " " + name);
    const cls = DOTS_CLASSES[classId];

    content.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="fusion-stage" style="--dot-color:${cls.color}">
        <div class="fusion-title">Собираем ${escapeHtml(name)}</div>
        <div class="fusion-sub">Класс: ${cls.name}</div>
        ${[1,2,3,4,5,6,7,8].map(i => {
          const c = Object.values(DOTS_CLASSES)[(i-1) % 4];
          const angle = (i * 45) + (Math.random() * 20 - 10);
          const dist = 140 + Math.random() * 40;
          const fx = Math.cos(angle * Math.PI / 180) * dist;
          const fy = Math.sin(angle * Math.PI / 180) * dist;
          const delay = (i - 1) * 0.12;
          return '<div class="fusion-particle" style="--fx:'+fx+'px;--fy:'+fy+'px;animation-delay:'+delay+'s"><img src="'+c.img+'" alt=""></div>';
        }).join('')}
        <div class="fusion-flash"></div>
        <div class="fusion-ring"></div>
        ${[0,45,90,135,180,225,270,315].map(a => {
          const dist = 100;
          const sx = Math.cos(a * Math.PI / 180) * dist;
          const sy = Math.sin(a * Math.PI / 180) * dist;
          return '<div class="fusion-sparkle" style="--sx:'+sx+'px;--sy:'+sy+'px;top:50%;left:50%;animation-delay:'+(2.1 + Math.random()*0.15)+'s"></div>';
        }).join('')}
        <div class="fusion-result"><img src="${cls.img}" alt=""></div>
      </div>
    `;

    setTimeout(()=>{
      content.innerHTML = `
        <div class="sheet-handle"></div>
        <h2>Готово!</h2>
        <div class="dot-preview">
          <div class="dot-preview-avatar"><img src="${cls.img}" alt=""></div>
          <div class="dot-preview-name">${escapeHtml(name)}</div>
          <div class="dot-preview-class">Класс: ${cls.name}</div>
          <div class="dot-preview-desc">${escapeHtml(cls.desc)}</div>
        </div>
        <button class="sheet-cta" id="dot-to-chat">Перейти в чат</button>
      `;
      content.querySelector("#dot-to-chat").addEventListener("click", ()=>{
        const dot = {
          name, classId,
          color: cls.color, colorSoft: cls.colorSoft,
          img: cls.img, desc: cls.desc,
          sphere, custom: true, createdAt: Date.now(),
        };
        addCustomDot(dot);
        // Закрываем модалку, потом открываем чат через setTimeout
        closeSheet();
        setTimeout(()=> startDotChat(dot), 50);
      });
    }, 3300);
  });
}

function showMyDots(){
  const customDots = loadCustomDots();
  if (!customDots.length){
    const html = `
      <div class="sheet-handle"></div>
      <h2>Мои Dots</h2>
      <div class="sheet-sub">Пока пусто. Создай своего Dots.</div>
      <button class="sheet-cta" id="create-first">Создать Dots</button>
    `;
    const content = showSheet(html);
    content.querySelector("#create-first").addEventListener("click", ()=>{
      closeSheet(); setTimeout(showCreateDot, 150);
    });
    return;
  }
  let tilesHtml = "";
  customDots.forEach((dot, idx) => {
    tilesHtml += `
      <div class="my-dot-card" data-custom="${idx}" style="--dot-color:${dot.color};--dot-color-soft:${dot.colorSoft}">
        <div class="my-dot-avatar"><img src="${dot.img}" alt=""></div>
        <div class="my-dot-name">${escapeHtml(dot.name)}</div>
        <div class="my-dot-class">${(DOTS_CLASSES[dot.classId] && DOTS_CLASSES[dot.classId].name) || "Dots"}</div>
        <div class="my-dot-desc">${escapeHtml(dot.desc)}</div>
      </div>
    `;
  });
  const html = `
    <div class="sheet-handle"></div>
    <h2>Мои Dots</h2>
    <div class="sheet-sub">Твои личные помощники.</div>
    <div class="my-dots-grid">${tilesHtml}</div>
    <button class="sheet-cta secondary" id="add-new">Создать ещё одного</button>
  `;
  const content = showSheet(html);
  content.querySelectorAll(".my-dot-card").forEach(tile => {
    tile.addEventListener("click", ()=>{
      const custom = loadCustomDots()[parseInt(tile.dataset.custom)];
      if (!custom) return;
      closeSheet();
      const existing = loadChats().filter(c => c.dotName === custom.name && c.dotClass === custom.classId).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
      setTimeout(()=> existing ? openChat(existing.id) : startDotChat(custom), 50);
    });
  });
  const addBtn = content.querySelector("#add-new");
  if (addBtn) addBtn.addEventListener("click", ()=>{ closeSheet(); setTimeout(showCreateDot, 150); });
}

function startDotChat(dot){
  const chat = createChat({
    title: dot.name, dotClass: dot.classId, dotName: dot.name,
    dotDesc: dot.desc, dotImg: dot.img,
    dotColor: dot.color, dotColorSoft: dot.colorSoft, dotSphere: dot.sphere || null,
  });
  memory.state.awaiting = null;
  memory.lastCity = null;
  memory.citiesSeen = [];
  openChat(chat.id);
  setTimeout(()=> inputEl.focus(), 120);
}

/* Popover */
let popoverOpen = false;
fabDots.addEventListener("click", (e)=>{
  e.stopPropagation();
  popoverOpen = !popoverOpen;
  dotsPopover.classList.toggle("visible", popoverOpen);
});
document.addEventListener("click", (e)=>{
  if (popoverOpen && !dotsPopover.contains(e.target) && e.target !== fabDots){
    popoverOpen = false;
    dotsPopover.classList.remove("visible");
  }
});
dotsPopover.querySelectorAll(".dots-popover-item").forEach(item => {
  item.addEventListener("click", ()=>{
    const action = item.dataset.action;
    popoverOpen = false;
    dotsPopover.classList.remove("visible");
    setTimeout(()=>{
      if (action === "create") showCreateDot();
      else if (action === "write") showMyDots();
      else if (action === "about") showAboutDots();
    }, 100);
  });
});

/* OCR */
function loadTesseract(){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
plusBtn.addEventListener("click", ()=>{ fileInput.click(); });
fileInput.addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if (!file || !currentChatId) return;
  fileInput.value = "";
  replyChatId = currentChatId;
  if (welcomeEl) welcomeEl.style.display = "none";
  const imgUrl = URL.createObjectURL(file);
  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  const img = document.createElement("img");
  img.src = imgUrl; img.className = "uploaded-img";
  userMsg.appendChild(img);
  messagesEl.appendChild(userMsg);
  scrollBottom();
  persistMessage("user", "[Фото]");
  const statusEl = addStatus("Читаю текст...");
  try {
    if (!window.Tesseract) await loadTesseract();
    const { data } = await Tesseract.recognize(file, "rus+eng", { logger: () => {} });
    const recognized = (data.text || "").trim();
    statusEl.remove();
    if (!recognized || recognized.length < 3){
      const msg = "Не смог разобрать.";
      const botEl = addMsg("", "bot");
      streamText(botEl, msg, ()=>{ persistMessage("bot", msg); updatePreviewFromLastBot(); });
      return;
    }
    const preview = recognized.length > 200 ? recognized.slice(0,200)+"…" : recognized;
    const note = "Распознал: «"+escapeHtml(preview.replace(/\n/g," "))+"»";
    const noteEl = addMsg("", "bot");
    streamText(noteEl, note, ()=>{ persistMessage("bot", note); updatePreviewFromLastBot(); });
  } catch(err){
    statusEl.remove();
    const botEl = addMsg("", "bot");
    streamText(botEl, "Не удалось.", ()=>{ persistMessage("bot", "Не удалось."); updatePreviewFromLastBot(); });
  }
});

atBtn.addEventListener("click", ()=>{
  cmdPanel.classList.toggle("visible");
  atBtn.classList.toggle("active");
});
cmdPanel.querySelectorAll(".cmd-item").forEach(item => {
  item.addEventListener("click", ()=>{
    inputEl.value = item.dataset.cmd;
    inputEl.focus();
    inputEl.dispatchEvent(new Event("input"));
    cmdPanel.classList.remove("visible");
    atBtn.classList.remove("active");
  });
});
screenEl.addEventListener("click", (e)=>{
  if (!cmdPanel.contains(e.target) && e.target !== atBtn){
    cmdPanel.classList.remove("visible");
    atBtn.classList.remove("active");
  }
});

let recognition = null;
let isRecording = false;
micBtn.addEventListener("click", ()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ showToast("Голосовой ввод не поддерживается"); return; }
  if (!recognition){
    recognition = new SR();
    recognition.lang = "ru-RU"; recognition.continuous = false; recognition.interimResults = true;
    recognition.onresult = (e)=>{
      let transcript = "";
      for (let i = e.resultIndex; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      inputEl.value = transcript;
      inputEl.dispatchEvent(new Event("input"));
    };
    recognition.onerror = ()=>{ isRecording = false; micBtn.classList.remove("recording"); };
    recognition.onend = ()=>{ isRecording = false; micBtn.classList.remove("recording"); };
  }
  if (isRecording){ try { recognition.stop(); } catch {} }
  else { try { recognition.start(); isRecording = true; micBtn.classList.add("recording"); showToast("Говорите..."); } catch {} }
});

inputEl.addEventListener("input", ()=>{
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + "px";
  updateSendBtn();
  const len = inputEl.value.length;
  if (len > 0){ charCounter.textContent = len; charCounter.classList.add("visible"); }
  else charCounter.classList.remove("visible");
  lastActivityAt = Date.now();
});
inputEl.addEventListener("keydown", (e)=>{
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if (e.isComposing) return; finishStream(); send(); }
});
sendBtn.addEventListener("click", ()=>{
  if (isStreaming){ finishStream(); return; }
  send();
});

backBtn.addEventListener("click", goHome);
newChatBtn.addEventListener("click", startNewChat);
fabNew.addEventListener("click", startNewChat);
searchBtn.addEventListener("click", openSearch);
searchClose.addEventListener("click", closeSearch);
searchInput.addEventListener("input", (e)=> renderSearchResults(e.target.value));
themeBtn.addEventListener("click", ()=>{
  const isDark = document.documentElement.classList.contains("dark");
  applyTheme(!isDark);
  ls.set(THEME_KEY, !isDark ? "dark" : "light");
});
screenEl.addEventListener("click", (e)=>{
  if (e.target === screenEl || e.target === welcomeEl || e.target.closest(".welcome")) inputEl.focus();
});

function init(){
  initTheme();
  renderHome();
  const lastId = ls.get(CURRENT_KEY);
  if (lastId && getChat(lastId)) openChat(lastId);
  else { homeScreen.classList.remove("hidden"); chatScreen.classList.add("hidden"); }
}
[["search-btn","Поиск"],["theme-btn","Тема"],["fab-dots","Dots"],["fab-new","Новый чат"],["back-btn","Назад"],["new-chat","Новый чат"],
 ["plus-btn","Прикрепить фото"],["at-btn","Команды"],["mic-btn","Голосовой ввод"],["send","Отправить"],["search-close","Закрыть поиск"]]
  .forEach(([id, l]) => { const e = document.getElementById(id); if (e) e.setAttribute("aria-label", l); });
if (window.visualViewport){   /* поле ввода поднимается над экранной клавиатурой */
  const upd = ()=>{ const vv = window.visualViewport;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", kb + "px"); if (kb > 0) scrollBottom(); };
  window.visualViewport.addEventListener("resize", upd); window.visualViewport.addEventListener("scroll", upd);
}
document.addEventListener("keydown", (e)=>{
  if (e.key !== "Escape") return;
  const o = document.querySelector(".ctx-overlay"); if (o){ o.remove(); return; }
  if (document.getElementById("sheet-overlay")){ closeSheet(); return; }
  if (searchPanel.style.display === "flex"){ closeSearch(); return; }
  if (popoverOpen){ popoverOpen = false; dotsPopover.classList.remove("visible"); }
});
messagesEl.addEventListener("click", (e)=>{   /* кнопки в сообщениях работают и после повторного открытия чата */
  const ai = e.target.closest(".ask-ai-btn");
  if (ai){ ai.disabled = true; replyChatId = currentChatId; handleDonor(decodeURIComponent(ai.dataset.q)); return; }
  const ex = e.target.closest(".expand-btn[data-q]");
  if (ex){ ex.disabled = true; replyChatId = currentChatId; handleSearch(decodeURIComponent(ex.dataset.q), { full: true }); }
});
init();
if (!ls.persistent) setTimeout(()=> showToast("Память браузера недоступна: чаты сохранятся до закрытия страницы"), 700);
</script>
