<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>check — быстрый ИИ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f4f2;
    --card: rgba(255,255,255,0.72);
    --text: #1a1a1a;
    --text-dim: #5a5a60;
    --text-mute: #8a8a92;
    --glass-bg: rgba(255,255,255,0.62);
    --glass-border: rgba(255,255,255,0.72);
    --bot-bg: #ffffff;
    --chip-bg: rgba(255,255,255,0.85);
    --hairline: rgba(0,0,0,0.07);
    --dot-color: #f5c518;
    --dot-color-soft: rgba(245,197,24,0.15);
  }
  html.dark {
    --bg: #131316;
    --card: rgba(38,38,44,0.72);
    --text: #f2f2f4;
    --text-dim: #b6b6bd;
    --text-mute: #86868e;
    --glass-bg: rgba(38,38,44,0.65);
    --glass-border: rgba(255,255,255,0.08);
    --bot-bg: #26262c;
    --chip-bg: rgba(48,48,56,0.75);
    --hairline: rgba(255,255,255,0.09);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overscroll-behavior: none; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; height: 100dvh; }
  svg, img { display: block; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  #home-screen {
    flex: 1; overflow-y: auto;
    padding: 0 14px 140px 14px;
    -webkit-overflow-scrolling: touch;
    display: block; background: var(--bg);
  }
  #home-screen.hidden { display: none; }
  .home-topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 10px 2px;
    background: linear-gradient(to bottom, var(--bg) 65%, transparent);
  }
  .home-topbar .home-left { display: flex; gap: 8px; }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
  }
  .menu-btn:active { transform: scale(.93); }

  .date-group { margin-bottom: 16px; }
  .date-label {
    font-size: 15px; font-weight: 500;
    color: var(--text-mute); letter-spacing: -0.2px;
    padding: 10px 4px 8px 4px;
  }
  .chats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; width: 100%;
  }
  .chat-card {
    border-radius: 24px; cursor: pointer;
    transition: transform .15s;
    position: relative; overflow: hidden; min-height: 180px;
    display: flex; flex-direction: column;
    background: var(--card);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 2px 14px rgba(0,0,0,0.05);
    border: 1px solid var(--glass-border);
    user-select: none; -webkit-user-select: none;
    width: 100%; box-sizing: border-box;
  }
  .chat-card:active { transform: scale(.975); }
  .chat-card.dot-card {
    background: linear-gradient(135deg, var(--dot-color-soft, transparent) 0%, var(--card) 60%);
  }
  .chat-card .card-dot {
    position: absolute; top: 8px; right: 8px;
    width: 44px; height: 44px; z-index: 2;
    animation: cardDotBounce 2.4s ease-in-out infinite;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  .chat-card .card-dot img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes cardDotBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .chat-card .card-body {
    padding: 14px 16px 18px 16px;
    display: flex; flex-direction: column; gap: 8px;
    flex: 1; min-height: 0; width: 100%; box-sizing: border-box;
    overflow: hidden; position: relative; z-index: 1;
  }
  .chat-card .card-title {
    font-size: 22px; font-weight: 700; color: var(--text);
    line-height: 1.1; letter-spacing: -0.7px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word; width: 100%;
    padding-right: 48px;
  }
  .chat-card .card-preview {
    font-size: 14.5px; color: var(--text-mute); line-height: 1.32;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
    overflow: hidden; letter-spacing: -0.15px; width: 100%;
  }

  .fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 64px; height: 64px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 15;
    transition: transform .12s;
  }
  .fab:active { transform: scale(.92); }
  .fab-dots { left: 20px; color: var(--text); }
  .fab-new {
    right: 20px; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  .dots-popover {
    position: fixed;
    left: 20px;
    bottom: calc(96px + env(safe-area-inset-bottom));
    width: 210px;
    border-radius: 22px;
    padding: 6px;
    z-index: 100;
    display: none;
    animation: popFromBottom .22s cubic-bezier(.2,.9,.3,1.1);
    transform-origin: bottom left;
    background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.85) 100%);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.72);
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 12px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  html.dark .dots-popover {
    background: linear-gradient(135deg, rgba(40,40,46,0.88) 0%, rgba(30,30,36,0.72) 45%, rgba(38,38,44,0.85) 100%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dots-popover.visible { display: block; }
  @keyframes popFromBottom {
    from { opacity: 0; transform: scale(.85) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .dots-popover-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 13.5px; font-weight: 500;
    color: var(--text);
    transition: background .12s;
    letter-spacing: -0.15px;
    position: relative;
  }
  .dots-popover-item:active { background: rgba(127,127,127,0.14); }
  .dots-popover-item svg { flex-shrink: 0; width: 17px; height: 17px; opacity: 0.85; }
  .dots-popover-sep { height: 1px; background: var(--hairline); margin: 4px 10px; }

  .ctx-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn .16s ease;
  }
  .ctx-overlay.visible { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } }
  .ctx-menu {
    width: 220px;
    border-radius: 22px;
    padding: 6px;
    background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.72) 45%, rgba(255,255,255,0.85) 100%);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.72);
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 16px 48px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    animation: popFromCenter .22s cubic-bezier(.2,.9,.3,1.1);
    position: relative; overflow: hidden;
  }
  html.dark .ctx-menu {
    background: linear-gradient(135deg, rgba(40,40,46,0.88) 0%, rgba(30,30,36,0.72) 45%, rgba(38,38,44,0.85) 100%);
    border: 1px solid rgba(255,255,255,0.1);
  }
  @keyframes popFromCenter {
    from { opacity: 0; transform: scale(.9) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .ctx-title {
    padding: 8px 12px 4px;
    font-size: 11px; color: var(--text-mute);
    font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 13.5px; font-weight: 500;
    color: var(--text);
    letter-spacing: -0.15px;
    position: relative;
  }
  .ctx-item:active { background: rgba(127,127,127,0.14); }
  .ctx-item.danger { color: #ff3b30; }
  .ctx-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
  .ctx-sep { height: 1px; background: var(--hairline); margin: 4px 10px; }

  #chat-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  #chat-screen.hidden { display: none; }

  .topbar {
    position: relative;
    padding: 8px 16px 14px 16px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: transparent;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .topbar .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    position: relative; z-index: 3;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
    box-shadow: none;
  }
  .topbar .icon-btn:active { transform: scale(.93); }

  .chat-header {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: calc(env(safe-area-inset-top));
    pointer-events: none; z-index: 2;
  }
  .chat-header-dot {
    width: 84px; height: 84px;
    animation: cardDotBounce 2.6s ease-in-out infinite;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.15));
    pointer-events: none;
    margin-top: 4px;
  }
  .chat-header-dot img { width: 100%; height: 100%; object-fit: contain; }
  .chat-header-plate {
    margin-top: -14px;
    padding: 7px 18px 8px 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.58) 45%, rgba(255,255,255,0.72) 100%);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.04);
    display: flex; flex-direction: column; align-items: center;
    max-width: 78vw;
    pointer-events: auto;
  }
  html.dark .chat-header-plate {
    background: linear-gradient(135deg, rgba(40,40,46,0.85) 0%, rgba(30,30,36,0.65) 45%, rgba(38,38,44,0.8) 100%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 24px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
  }
  .chat-header-dotname {
    font-size: 15.5px; font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text);
    line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .chat-header-chattitle {
    font-size: 11.5px; font-weight: 500;
    color: var(--text-mute);
    letter-spacing: -0.1px;
    margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .chat-title-plain {
    flex: 1; text-align: center;
    font-size: 16px; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 12px 8px 0 8px;
    align-self: flex-start;
  }
  .topbar.has-dot { padding-top: calc(112px + env(safe-area-inset-top)); }

  .chat-title {
    text-align: center; font-size: 16px; font-weight: 600;
    color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .chat-title-dot {
    width: 28px; height: 28px;
    animation: cardDotBounce 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  .chat-title-dot img { width: 100%; height: 100%; object-fit: contain; }

  #screen { flex: 1; overflow-y: auto; padding: 8px 16px 160px 16px; -webkit-overflow-scrolling: touch; }
  .welcome {
    min-height: 45vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 18px; color: var(--text-mute);
    padding: 20px;
  }
  .welcome .logo { width: 62px; height: 62px; color: var(--text); opacity: .9; }
  .welcome .dot-hero {
    width: 120px; height: 120px;
    animation: dotHero 2.6s ease-in-out infinite;
  }
  .welcome .dot-hero img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes dotHero {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .welcome h1 {
    font-size: 19px; font-weight: 500; line-height: 1.4;
    margin: 0; max-width: 320px; color: var(--text-dim); letter-spacing: -0.3px;
  }
  .welcome-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; max-width: 340px;
  }

  #messages { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  .msg {
    max-width: 86%; padding: 12px 16px; border-radius: 22px;
    line-height: 1.5; font-size: 15px;
    word-wrap: break-word;
    animation: msgIn .22s cubic-bezier(.2,.9,.3,1);
    letter-spacing: -0.15px;
    position: relative;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .user {
    align-self: flex-end; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    border-bottom-right-radius: 8px;
    box-shadow: 0 2px 10px rgba(10,10,10,0.15);
    white-space: pre-wrap;
  }
  html.dot-mode .user {
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--dot-color) 60%, #000) 0%,
      var(--dot-color) 100%);
    color: #1a1a1a;
  }
  .bot {
    align-self: flex-start; color: var(--text);
    background: var(--bot-bg);
    border-bottom-left-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid var(--hairline);
  }
  .msg a { color: #0a84ff; text-decoration: none; }
  .msg .src {
    display: block; margin-top: 8px; font-size: 12px;
    color: var(--text-mute); line-height: 1.4;
  }
  .msg b, .msg strong { font-weight: 700; }
  .msg i, .msg em { font-style: italic; }
  .msg code {
    background: rgba(127,127,127,0.15);
    padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
  }
  .msg pre {
    background: rgba(127,127,127,0.12);
    padding: 12px; border-radius: 12px;
    overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px; line-height: 1.5;
    margin: 8px 0;
    position: relative;
  }
  .msg pre code { background: none; padding: 0; }
  .msg ul, .msg ol { padding-left: 22px; margin: 8px 0; }
  .msg li { margin: 4px 0; }
  .msg h1, .msg h2, .msg h3 { margin: 12px 0 6px; line-height: 1.2; letter-spacing: -0.4px; }
  .msg h1 { font-size: 20px; }
  .msg h2 { font-size: 17px; }
  .msg h3 { font-size: 15.5px; }
  .msg blockquote {
    border-left: 3px solid var(--dot-color, #0071e3);
    padding: 4px 0 4px 12px;
    margin: 8px 0;
    color: var(--text-dim);
  }
  .msg hr { border: none; height: 1px; background: var(--hairline); margin: 12px 0; }

  .msg table {
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13.5px;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    display: block;
    border-radius: 10px;
    border: 1px solid var(--hairline);
  }
  .msg table thead { background: rgba(127,127,127,0.08); }
  .msg table th, .msg table td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--hairline);
    vertical-align: top;
  }
  .msg table tr:last-child td { border-bottom: none; }
  .msg table th { font-weight: 700; color: var(--text); }

  .fraction {
    display: inline-flex; flex-direction: column; align-items: center;
    vertical-align: middle; margin: 0 3px;
    font-size: 0.85em; line-height: 1.05;
    position: relative; top: -0.08em;
    font-style: normal;
  }
  .fraction .num { border-bottom: 1.5px solid currentColor; padding: 0 5px 1px 5px; }
  .fraction .den { padding: 1px 5px 0 5px; }

  .expand-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 14px;
    background: rgba(127,127,127,0.10);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text); cursor: pointer;
    font-family: inherit;
  }
  .expand-btn:active { transform: scale(.97); }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--chip-bg);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text); cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .chip:active { transform: scale(.96); }
  .wiki-img-wrap {
    display: inline-block; margin: 4px 0 10px 0;
    border-radius: 14px; overflow: hidden;
    background: #eef0f3; line-height: 0;
    max-width: 220px;
  }
  .wiki-img {
    display: block; max-width: 100%; max-height: 220px;
    width: auto; height: auto;
    opacity: 0; transition: opacity .3s; cursor: pointer;
  }
  .wiki-img.loaded { opacity: 1; }
  .qr-wrap {
    display: inline-block; margin: 8px 0;
    padding: 10px; background: #ffffff;
    border-radius: 12px;
  }
  .qr-wrap img { display: block; width: 180px; height: 180px; }
  .timer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    background: var(--chip-bg);
    border-radius: 16px;
    font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 18px;
  }
  .timer-badge.done { color: #ff3b30; }
  .cursor {
    display: inline-block; width: 7px; height: 15px;
    background: var(--text); margin-left: 2px; vertical-align: -2px;
    animation: blink .9s steps(2,start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .dots-anim span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    background: #c0c0c5; border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots-anim span:nth-child(2){ animation-delay: .15s; }
  .dots-anim span:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:.5; }
    30% { transform: translateY(-4px); opacity:1; }
  }
  .status-line {
    font-size: 13px; color: var(--text-mute);
    padding: 4px 2px; display: flex; align-items: center; gap: 8px;
  }
  .status-line .spin {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #d8d8dc; border-top-color: var(--text);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Прогресс-бар */
  .progress-bar-container {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 2px;
  }
  .progress-bar-track {
    flex: 1; height: 6px;
    background: rgba(127,127,127,0.15);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;

  .sheet-feature-title {
    font-size: 17px; font-weight: 600;
    letter-spacing: -0.35px; margin-bottom: 5px;
  }
  .sheet-feature-desc {
    font-size: 15px; color: var(--text-mute);

  }

  .sheet-cta {
    width: 100%; padding: 17px 20px;

    letter-spacing: -0.35px;
  }

  .create-form { display: flex; flex-direction: column; gap: 18px; margin-bottom: 24px; }
  .field-label {

  }

  .field-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .field-chip {
    padding: 9px 16px;

  }
  .field-chip.active { background: #0071e3; color: #fff; border-color: #0071e3; }

  .dot-preview {
    display: flex; flex-direction: column; align-items: center;

  }
  .dot-preview-avatar {
    width: 130px; height: 130px;
    animation: dotPop .5s cubic-bezier(.2,1.4,.5,1);
  }
  .dot-preview-avatar img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes dotPop {
    from { transform: scale(0.2); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .dot-preview-name {
    font-size: 27px; font-weight: 700;
    letter-spacing: -0.9px;
  }
  .dot-preview-class {
    font-size: 14.5px; color: var(--text-mute);
  }
  .dot-preview-desc {
    font-size: 15.5px; line-height: 1.5;

  }

  .fusion-stage {
    position: relative;
    width: 100%;
    height: 320px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .fusion-title {
    position: absolute; top: 0; left: 0; right: 0;
    text-align: center;
    font-size: 20px; font-weight: 600;
    letter-spacing: -0.5px;
    animation: fadeInUp .5s ease;
  }
  .fusion-sub {
    position: absolute; top: 32px; left: 0; right: 0;
    text-align: center;
    font-size: 14px; color: var(--text-mute);
    animation: fadeInUp .5s ease .1s backwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fusion-particle {
    position: absolute;
    top: 50%; left: 50%;
    width: 40px; height: 40px;
    opacity: 0;
    animation: particleFly 2s cubic-bezier(.4,0,.5,1) forwards;
  }
  .fusion-particle img {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }
  @keyframes particleFly {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) translate(var(--fx), var(--fy)) scale(0.5) rotate(-30deg);
    }
    15% { opacity: 1; }
    55% {
      opacity: 1;
      transform: translate(-50%, -50%) translate(calc(var(--fx) * 0.4), calc(var(--fy) * 0.4)) scale(0.85) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) translate(0, 0) scale(0.3) rotate(30deg);
    }
  }
  .fusion-flash {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: white;
    opacity: 0;
    animation: flashPop 0.6s ease-out 1.9s forwards;
    box-shadow: 0 0 60px 30px var(--dot-color, #0071e3);
  }
  @keyframes flashPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    40% { opacity: 0.9; transform: translate(-50%, -50%) scale(3); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(6); }
  }
  .fusion-result {
    position: absolute;
    top: 50%; left: 50%;
    width: 140px; height: 140px;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: resultReveal 0.9s cubic-bezier(.2,1.3,.5,1) 2.2s forwards;
  }
  .fusion-result img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes resultReveal {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-40deg); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(5deg); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
  }
  .fusion-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 100px; height: 100px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid var(--dot-color, #0071e3);
    opacity: 0;
    animation: ringExpand 1.1s ease-out 2.1s forwards;
  }
  @keyframes ringExpand {
    0% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.5); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
  }
  .fusion-sparkle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dot-color, #0071e3);
    opacity: 0;
    animation: sparkleBurst 1s ease-out 2.1s forwards;
  }
  @keyframes sparkleBurst {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(0.2); }
  }

  .my-dots-grid {

  .hidden { display: none !important; }

  .ask-ai-btn { margin-top: 10px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--hairline);
    background: rgba(127,127,127,0.10); color: var(--text); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-mute); font-size: 15px; line-height: 1.5; }

  :root { --kb: 0px; }

/* ===== v16 ===== */
html.dot-mode .user{background:var(--dot-color)!important;color:#1a1a1a}

.topbar .icon-btn{width:42px;height:42px;border-radius:50%}
.chat-title-plain{flex:0 1 auto;max-width:58vw;padding:10px 18px;border-radius:999px;margin-top:1px;align-self:flex-start}
.chat-header-plate{background:linear-gradient(145deg,rgba(255,255,255,.74),rgba(255,255,255,.48) 50%,rgba(255,255,255,.64))}

.pro-list{border-radius:20px;padding:2px 14px;margin-bottom:14px}
.pro-row{padding:11px 0;gap:11px}.pro-ic{width:32px;height:32px;border-radius:9px}.pro-ic svg{width:18px;height:18px}
.pro-t{font-size:14.5px;margin-bottom:2px}.pro-d{font-size:12.3px;line-height:1.35}

.think{align-self:flex-start;max-width:94%;padding:2px 2px 6px}

.att.ld{opacity:.5}

.file-chip{margin-top:6px;padding:8px 12px;border-radius:12px;background:rgba(127,127,127,.2);font-size:13px;word-break:break-all}
.msg.user .uploaded-img{margin:0 0 6px}
/* ===== v17: премиум-слой ===== */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.2,.9,.3,1.18)}
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg,#input,input,textarea,.priv-body{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit;touch-action:manipulation}
#screen,.sheet,#search-results,.cmd-panel{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* экраны как стек: чат въезжает справа, главная уходит с параллаксом */
#home-screen,#chat-screen{position:fixed;inset:0;height:auto;transition:transform .45s var(--ease),opacity .45s var(--ease),visibility 0s}
#home-screen{z-index:1;overscroll-behavior:contain}
#chat-screen{z-index:20;display:flex;box-shadow:-14px 0 44px rgba(0,0,0,.10)}
html.dark #chat-screen{box-shadow:-14px 0 44px rgba(0,0,0,.45)}
#home-screen.hidden{display:block!important;transform:translate3d(-26%,0,0);opacity:.6;visibility:hidden;pointer-events:none;transition:transform .45s var(--ease),opacity .45s var(--ease),visibility 0s .45s}
#chat-screen.hidden{display:flex!important;transform:translate3d(100%,0,0);visibility:hidden;pointer-events:none;box-shadow:none;transition:transform .45s var(--ease),visibility 0s .45s}
#chat-screen.hidden .cmd-panel{visibility:hidden}
#home-screen.peek{visibility:visible!important}
#chat-screen.drag,#home-screen.drag{transition:none!important}
#home-screen.hidden .card-dot{animation-play-state:paused}
/* топбар главной: стекло при прокрутке, безопасная зона */
.home-topbar{padding-top:calc(10px + env(safe-area-inset-top));transition:background-color .25s,box-shadow .25s,backdrop-filter .25s}
.home-topbar.scrolled{background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 .5px 0 var(--hairline)}
/* кнопки чуть крупнее */
.topbar .icon-btn{width:48px;height:48px}.topbar .icon-btn svg{width:25px;height:25px}
.menu-btn{width:48px;height:48px}.menu-btn svg{width:24px;height:24px}
#search-close{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);border:none;cursor:pointer}
.fab{width:68px;height:68px}.fab-pro{width:92px}.fab-dots svg{width:36px;height:36px}
.pill-btn{width:38px;height:38px}.pill-btn.at-btn{width:40px;height:40px}.send-btn{width:50px;height:50px}
.dlg-btn{padding:16px}.dots-popover-item{padding:15px 14px}.ctx-item{padding:15px}
/* единое ощущение нажатия */
.fab,.menu-btn,.icon-btn,.pill-btn,.send-btn,.dlg-btn,.sheet-cta,.dots-popover-item,.ctx-item,.chat-card,.expand-btn,.ask-ai-btn,.cmd-item,#search-close{transition:transform .38s var(--spring),background-color .2s,opacity .2s}
.fab:active,.menu-btn:active,.icon-btn:active,.pill-btn:active,.send-btn:active,.dlg-btn:active,.sheet-cta:active,.expand-btn:active,#search-close:active{transform:scale(.9);transition-duration:.1s}
.chat-card:active{transform:scale(.965);transition-duration:.1s}
.dots-popover-item:active,.ctx-item:active,.cmd-item:active{transform:scale(.97);transition-duration:.1s}
/* карточки без тяжёлого blur — плавный скролл */
.chat-card{-webkit-backdrop-filter:none;backdrop-filter:none;contain:layout paint}
.chats-grid.enter .chat-card{animation:cardIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes cardIn{from{opacity:0;transform:translate3d(0,22px,0) scale(.96)}}
/* сообщения */
#messages.restoring .msg,#messages.restoring .think{animation:none!important}
.msg{animation:msgIn .45s var(--ease) backwards;transform-origin:left bottom}
.msg.user{transform-origin:right bottom}
@keyframes msgIn{from{opacity:0;transform:translate3d(0,14px,0) scale(.96)}}
#welcome-text,.welcome-chips>*{animation:chipIn .6s var(--ease) backwards}
.welcome-chips>*:nth-child(1){animation-delay:.12s}.welcome-chips>*:nth-child(2){animation-delay:.18s}.welcome-chips>*:nth-child(3){animation-delay:.24s}.welcome-chips>*:nth-child(4){animation-delay:.3s}
@keyframes chipIn{from{opacity:0;transform:translate3d(0,16px,0)}}
.composer,.cmd-panel{transition:bottom .28s var(--ease)}
/* поповер и панель команд: плавно и туда, и обратно */
.dots-popover,.cmd-panel{display:block!important;opacity:0;visibility:hidden;pointer-events:none;animation:none!important;transition:opacity .2s var(--ease),transform .3s var(--ease),visibility 0s .3s,bottom .28s var(--ease)}
.dots-popover{transform:scale(.82) translate3d(0,12px,0)}
.cmd-panel{transform:translate3d(0,16px,0) scale(.98);transform-origin:bottom center}
.dots-popover.visible,.cmd-panel.visible{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .2s var(--ease),transform .42s var(--spring),visibility 0s,bottom .28s var(--ease)}
/* поиск */
#search-panel{animation:searchIn .36s var(--ease)}
#search-panel.out{animation:searchOut .23s var(--ease) forwards;pointer-events:none}
@keyframes searchIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}}
@keyframes searchOut{to{opacity:0;transform:translate3d(0,14px,0) scale(.99)}}
/* модалки: вход, выход, смахивание */
.sheet-overlay{animation:fadeIn .3s var(--ease)}
.sheet{animation:sheetUp .48s var(--ease);overscroll-behavior:contain}
@keyframes sheetUp{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}
@keyframes sheetDown{to{transform:translate3d(0,100%,0)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:scale(.94) translate3d(0,6px,0)}}
.sheet-overlay.out{animation:fadeOut .3s var(--ease) forwards;pointer-events:none}
.sheet-overlay.out .sheet{animation:sheetDown .32s var(--ease) forwards}
.ctx-overlay.out{animation:fadeOut .19s ease forwards;pointer-events:none}
.ctx-overlay.out .ctx-menu{animation:popOut .19s ease forwards}
.ctx-menu{animation:popFromCenter .4s var(--spring)}
.sheet-handle{position:relative;width:44px}
.sheet-handle::before{content:"";position:absolute;inset:-16px -60px}
.toast{animation:toastIn .35s var(--spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

</style>

  froggy: ["мем","шутк","юмор","весел","смешн","наук","хими","биолог","эксперимент","опыт","лаб","географ","стран"],
};
function detectDotClass(text){
  const lower = text.toLowerCase();
  let best = null, bestScore = 0;
  for (const [id, kws] of Object.entries(DOT_CLASS_KEYWORDS)){
    let score = 0;
    for (const kw of kws){ if (lower.includes(kw)) score += kw.length; }
    if (score > bestScore){ bestScore = score; best = id; }
  }
  return best || "teach";
}

function renderFraction(num, den){

const TEX_SYM={alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',phi:'φ',omega:'ω',Omega:'Ω',eta:'η',tau:'τ',cdot:'⋅',times:'×',div:'÷',pm:'±',le:'≤',leq:'≤',ge:'≥',geq:'≥',neq:'≠',ne:'≠',approx:'≈',infty:'∞',rightarrow:'→',to:'→',leftarrow:'←',Rightarrow:'⇒',circ:'°',sum:'∑',int:'∫',partial:'∂',nabla:'∇',ldots:'…',dots:'…',cdots:'⋯',angle:'∠',perp:'⊥',sin:'sin',cos:'cos',tan:'tan',tg:'tg',ctg:'ctg',log:'log',ln:'ln',lg:'lg',lim:'lim',min:'min',max:'max',exp:'exp'};

function codeBlock(c){

function mdInline(t){

    .replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:12px;margin:6px 0">')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*\*([^*\n]+?)\*\*\*/g,'<b><i>$1</i></b>')
    .replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\p{L}\p{N}])\*(?!\s)([^*\n]+?)(?<!\s)\*(?![\p{L}\p{N}])/gu,'$1<i>$2</i>')
    .replace(/(^|[^\p{L}\p{N}_])__([^_\n]+?)__(?![\p{L}\p{N}_])/gu,'$1<b>$2</b>')
    .replace(/(^|[^\p{L}\p{N}_])_([^_\n]+?)_(?![\p{L}\p{N}_])/gu,'$1<i>$2</i>')

function renderMd(src){
  if(!src) return "";
  let s=String(src).replace(/\r/g,"")
    .replace(/<\/?(b|strong)>/gi,'**').replace(/<\/?(i|em)>/gi,'*')
    .replace(/<br\s*\/?>|<\/(p|div|li|tr|h[1-6])>/gi,'\n').replace(/<\/?[a-z][^>]*>/gi,'');
  const P=[]; const ph=h=>{P.push(h);return "\u0001"+(P.length-1)+"\u0002";};
  s=escapeHtml(s);
  s=s.replace(/```[^\n]*\n?([\s\S]*?)```/g,(_,c)=>ph(codeBlock(c.replace(/\n$/,''))));
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>ph('<code>'+c+'</code>'));
  s=s.replace(/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]*?[\\^_=][^$\n]*?)\$/g,(_,a,b,c,d)=>ph('<span class="mth">'+texToHtml((a||b||c||d).trim())+'</span>'));
  const B2='(?:[^{}]|\\{[^{}]*\\})*', B3='(?:[^{}]|\\{'+B2+'\\})*';
  s=s.replace(new RegExp('\\\\(?:d|t)?frac\\s*\\{'+B3+'\\}\\s*\\{'+B3+'\\}|\\\\sqrt\\s*\\{'+B3+'\\}','g'),m=>ph('<span class="mth">'+texToHtml(m)+'</span>'));
  s=s.replace(new RegExp('([\\p{L}\\d)\\]])((?:[_^]\\{'+B3+'\\}|\\^-?[\\p{L}\\d]+|_\\d+)+)','gu'),m=>ph('<span class="mth">'+texToHtml(m)+'</span>'));
  s=s.replace(/\\([a-zA-Z]+)/g,(m,n)=>TEX_SYM[n]!==undefined?ph(TEX_SYM[n]):m);
  const L=s.split("\n"), out=[]; let i=0;
  const isTblSep=x=>x!==undefined&&x.includes('-')&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(x);
  const cells=x=>x.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const listRe=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const special=x=>/^\s{0,3}#{1,6}\s/.test(x)||/^\s*&gt;/.test(x)||listRe.test(x)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(x);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue;}
    if(l.includes('|')&&isTblSep(L[i+1])){
      const H=cells(l); const al=cells(L[i+1]).map(c=>/^:-+:$/.test(c)?'center':/-:$/.test(c)?'right':''); i+=2; const R=[];
      while(i<L.length&&L[i].includes('|')&&L[i].trim()){R.push(cells(L[i]));i++;}
      let h='<div class="tbl"><table><thead><tr>'+H.map((c,k)=>'<th'+(al[k]?' style="text-align:'+al[k]+'"':'')+'>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>';
      R.forEach(r=>{h+='<tr>'+H.map((_,k)=>'<td'+(al[k]?' style="text-align:'+al[k]+'"':'')+'>'+mdInline(r[k]||'')+'</td>').join('')+'</tr>';});
      out.push(h+'</tbody></table></div>'); continue;
    }
    let m=l.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(m){out.push('<h'+Math.min(m[1].length+0,3)+'>'+mdInline(m[2])+'</h'+Math.min(m[1].length+0,3)+'>');i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s*&gt;/.test(l)){const q=[];while(i<L.length&&/^\s*&gt;/.test(L[i])){q.push(mdInline(L[i].replace(/^\s*&gt;\s?/,'')));i++;}out.push('<blockquote>'+q.join('<br>')+'</blockquote>');continue;}
    if(listRe.test(l)){
      let h='',st=[];
      while(i<L.length&&listRe.test(L[i])){
        const [,ind,mk,tx]=L[i].match(listRe); const n=ind.replace(/\t/g,'  ').length, tag=/\d/.test(mk)?'ol':'ul';
        while(st.length&&n<st[st.length-1].n){h+='</li></'+st.pop().tag+'>';}
        const top=st[st.length-1];
        let body=mdInline(tx).replace(/^\[ \]\s*/,'<input type="checkbox" disabled> ').replace(/^\[[xX]\]\s*/,'<input type="checkbox" disabled checked> ');
        if(!top||n>top.n){h+='<'+tag+'><li>'+body;st.push({n,tag});}else if(top.tag!==tag){h+='</li></'+st.pop().tag+'><'+tag+'><li>'+body;st.push({n,tag});}else h+='</li><li>'+body;
        i++;
      }
      while(st.length)h+='</li></'+st.pop().tag+'>';
      out.push(h);continue;
    }
    const p=[];
    while(i<L.length&&L[i].trim()&&!(p.length&&(special(L[i])||(L[i].includes('|')&&isTblSep(L[i+1]))))){p.push(mdInline(L[i].trim()));i++;}
    out.push('<p>'+p.join('<br>')+'</p>');
  }
  let html=out.join('');
  for(let k=0;k<2;k++) html=html.replace(/\u0001(\d+)\u0002/g,(_,n)=>P[+n]);
  return html.replace(/<p>(<div class="code-wrap">[\s\S]*?<\/div><\/div>)<\/p>/g,'$1');
}

function dateLabel(ts){
  const d = new Date(ts), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());

async function fetchWikipedia(query, full){
  const clean = query
    .replace(/^(что такое|кто такой|кто такая|кто такие|расскажи про|расскажи о|расскажи об|объясни|объясните|поясни|растолкуй|что значит|определение|что означает|что за)\s+/i, "")
    .replace(/[?!.]+$/,"").trim();
  if (!clean || clean.length > 120) return null;
  const getPage = async (lang, title) => {
    try {
      const exIntro = full ? "" : "&exintro=1";
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
        `&prop=extracts|info|pageimages&inprop=url&explaintext=1&redirects=1`+
        `&piprop=thumbnail|name&pithumbsize=500`+exIntro+
        `&titles=${encodeURIComponent(title)}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data.query && data.query.pages;
      if (!pages) return null;
      const page = Object.values(pages)[0];
      if (!page || !page.extract || page.extract.length < 20) return null;
      let image = null;
      if (page.thumbnail && page.thumbnail.source){
        image = page.thumbnail.source;
        if (/\.svg$/i.test(image)) image = null;
      }
      return { title: page.title, extract: page.extract,
        url: page.fullurl || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`,
        lang, image };
    } catch { return null; }
  };
  const search = async (lang, q) => {
    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const hit = data.query && data.query.search && data.query.search[0];
      return hit ? hit.title : null;
    } catch { return null; }
  };
  for (const lang of ["ru","en"]){
    let r = await getPage(lang, clean);
    if (r) return r;
    const found = await search(lang, clean);
    if (found){ r = await getPage(lang, found); if (r) return r; }
  }
  return null;
}
function cleanWikiText(text){
  return text
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F2FF}\u{FE0F}\u{200D}]/gu, "")
    .replace(/\s*\([^)]*\)/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}
function shortenWiki(text, maxLen){
  maxLen = maxLen || 500;
  let t = cleanWikiText(text).replace(/\s+/g," ").trim();
  if (t.length <= maxLen) return t;
  const cut = t.slice(0, maxLen);
  const lastDot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (lastDot > 180) return cut.slice(0, lastDot+1);
  return cut.trim() + "…";
}

  [[/ке$/,"ка"],[/е$/,"а"],[/е$/,""],[/у$/,"а"],[/ы$/,"а"],[/и$/,"а"],[/ой$/,"а"],[/ом$/,""]].forEach(([re, r]) => { if (re.test(k)) out.push(k.replace(re, r)); });

  return pick(["Погода в ","Сейчас в ","В "]) + city + ": " + w.sky + ", около " + w.temp + "°C. На улице " + word + ". (Приблизительно: онлайн-сервис погоды недоступен.)";
}

/* ============================================================
   МАТЕМАТИКА
   ============================================================ */
function safeMath(expr){
  if (!/^[\d+\-*/().\s^%]+$/.test(expr)) return null;
  let js = expr.replace(/\^/g,"**");
  try {
    const t = tokenize(js); const r = parseExpr(t);
    if (t.length) return null;
    if (typeof r!=="number" || !isFinite(r)) return null;
    return r;
  } catch { return null; }
}
function tokenize(s){
  const re = /\s*(\d+\.?\d*|\*\*|[+\-*/()%])/g; const out=[]; let m,last=0;
  while ((m=re.exec(s))) { if (m.index!==last) throw 0; out.push(m[1]); last=re.lastIndex; }
  if (last!==s.length) throw 0;
  return out;
}
function parseExpr(t){ let l=parseTerm(t); while (t[0]==="+"||t[0]==="-"){ const o=t.shift(); const r=parseTerm(t); l = o==="+"?l+r:l-r;} return l; }
function parseTerm(t){ let l=parsePow(t); while (t[0]==="*"||t[0]==="/"||t[0]==="%"){ const o=t.shift(); const r=parsePow(t); if(o==="*")l*=r; else if(o==="/")l/=r; else l%=r;} return l; }
function parsePow(t){ let b=parseFactor(t); if(t[0]==="**"){ t.shift(); const e=parsePow(t); return Math.pow(b,e);} return b; }
function parseFactor(t){
  const tok=t.shift();
  if (tok==="("){ const v=parseExpr(t); if(t.shift()!==")") throw 0; return v; }
  if (tok==="-") return -parseFactor(t);
  if (tok==="+") return parseFactor(t);
  const n=Number(tok); if (isNaN(n)) throw 0; return n;
}
function fmt(n){ return Number.isInteger(n) ? n : +n.toFixed(6); }
function extractMath(text){
  const m = text.match(/[-+]?\d[\d\s+\-*/().^%]*\d|[-+]?\d/);
  return m ? m[0].trim() : null;
}

function downloadFile(content, name, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function chatToMarkdown(chat){
  let md = "# " + chat.title + "\n\n";
  if (chat.dotName) md += "*Dots: " + chat.dotName + "*\n\n";
  chat.messages.forEach(m => {
    const who = m.who === "user" ? "**Вы**" : ("**" + (chat.dotName || "check") + "**");
    md += who + ":\n\n" + m.text.replace(/<[^>]+>/g, "") + "\n\n---\n\n";
  });
  return md;
}
function handleCtxAction(action, chatId){
  const chat = getChat(chatId);
  if (!chat) return;
  if (action === "delete"){
    uiDialog({ title: "Удалить чат?", text: "«" + chat.title + "» будет удалён безвозвратно.", ok: "Удалить", danger: true }).then(ok => {
      if (!ok) return;
      deleteChat(chatId); renderHome();
      if (currentChatId === chatId) goHome();
    });
  } else if (action === "rename"){
    uiDialog({ title: "Переименовать", input: chat.title, ok: "Сохранить" }).then(v => {
      if (v && v.trim()){ updateChat(chatId, { title: v.trim() }); renderHome(); }
    });
  } else if (action === "export"){
    downloadFile(JSON.stringify(chat, null, 2), (chat.title || "chat").replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, "_") + ".json", "application/json");
    showToast("JSON экспортирован");
  } else if (action === "export-md"){
    downloadFile(chatToMarkdown(chat), (chat.title || "chat").replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, "_") + ".md", "text/markdown");
    showToast("Markdown экспортирован");
  } else if (action === "import"){
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && Array.isArray(imported.messages)){
            const valid = !!DOTS_CLASSES[imported.dotClass];
            const clean = {
              id: "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
              title: String(imported.title || "Импорт").slice(0, 60), preview: String(imported.preview || "").slice(0, 100),
              createdAt: Date.now(), updatedAt: Date.now(),
              messages: imported.messages.filter(m => m && typeof m.text === "string").map(m => ({
                who: m.who === "user" ? "user" : "bot", text: m.who === "user" ? m.text : sanitizeHtml(m.text), ts: Number(m.ts) || Date.now() })),
              dotClass: valid ? imported.dotClass : null, dotName: valid && imported.dotName ? String(imported.dotName).slice(0, 24) : null,
              dotDesc: null, dotImg: null, dotColor: null, dotColorSoft: null, dotSphere: null,
            };
            const chats = loadChats(); chats.unshift(clean); saveChats(chats);
            renderHome(); showToast("Импортирован");
          } else showToast("Неверный формат файла");
        } catch (err) { showToast("Ошибка импорта"); }
      };
      reader.readAsText(file);
    };
    input.click();
  }
}

    else {
      const found = c.messages.find(m => m.text.replace(/<[^>]+>/g,"").toLowerCase().includes(q));

/* Прогресс: фразы + полоска */
const THINKING_PHRASES = [
  "Думает...",
  "Анализирует...",
  "Чекает сайты...",
  "Собирает информацию...",
  "Обрабатывает данные...",
  "Ведёт анализ...",
  "Складывает пазл...",
  "Проверяет факты...",
  "Формулирует ответ...",
  "Почти готово...",
];

function startProgress(statusEl, baseText){
  const started = Date.now();
  let phraseIdx = 0;
  const phraseTimer = setInterval(()=>{
    phraseIdx = (phraseIdx + 1) % THINKING_PHRASES.length;
    updateStatus(statusEl, THINKING_PHRASES[phraseIdx]);
  }, 2200);
  updateStatus(statusEl, THINKING_PHRASES[0]);

  // Прогресс-бар после 15 секунд
  let barEl = null;
  const barTimer = setTimeout(()=>{
    clearInterval(phraseTimer);
    const container = document.createElement("div");
    container.className = "progress-bar-container";
    container.innerHTML = '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:0%"></div></div><div class="progress-bar-label">Обработка</div>';
    statusEl.innerHTML = "";
    statusEl.appendChild(container);
    statusEl.style.display = "block";
    barEl = container.querySelector(".progress-bar-fill");
    const label = container.querySelector(".progress-bar-label");
    let pct = 0;
    const barInt = setInterval(()=>{
      pct = Math.min(95, pct + Math.random() * 6 + 1);
      if (barEl) barEl.style.width = pct + "%";
      if (pct > 80) label.textContent = "Ведёт анализ...";
      if (pct > 90) label.textContent = "Складывает информацию...";
    }, 500);
    statusEl._barInt = barInt;
  }, 15000);

  return {
    stop(){
      clearInterval(phraseTimer);
      clearTimeout(barTimer);
      if (statusEl._barInt) clearInterval(statusEl._barInt);
      if (barEl) barEl.style.width = "100%";
    }
  };
}

/* Форматирование готово сразу; печатается только текст (скрытая часть держит вёрстку) */
function streamText(el, html, done){
  finishStream();
  html=sanitizeHtml(html);
  el.innerHTML=html; el.dataset.streaming="1";
  const plain=el.textContent.length;
  if(!el.isConnected||plain>1400){ el.dataset.streaming="0"; if(done) done(); return; }
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), list=[]; let n;
  while((n=w.nextNode())) if(n.nodeValue.length) list.push(n);
  const nodes=list.map(tn=>{
    const full=tn.nodeValue, vis=document.createTextNode(""), hid=document.createElement("span");
    hid.className="tw-h"; hid.textContent=full;
    tn.parentNode.replaceChild(hid,tn); hid.parentNode.insertBefore(vis,hid);
    return {vis,hid,full,pos:0};
  });
  const cursor=document.createElement("span"); cursor.className="cursor";
  isStreaming=true; updateSendBtn();
  activeStream={el,html,done,cursor};
  const step=plain>500?6:(plain>200?4:2), speed=plain>500?18:24; let k=0;
  streamTimer=setInterval(()=>{
    if(!activeStream||activeStream.el!==el){clearInterval(streamTimer);return;}
    if(!el.isConnected){finishStream();return;}
    let left=step;
    while(left>0&&k<nodes.length){
      const o=nodes[k], take=Math.min(left,o.full.length-o.pos);
      o.pos+=take; left-=take;
      o.vis.nodeValue=o.full.slice(0,o.pos); o.hid.textContent=o.full.slice(o.pos);
      if(o.pos>=o.full.length){o.hid.remove();k++;}
    }
    if(k<nodes.length) nodes[k].hid.before(cursor);
    softScroll();
    if(k>=nodes.length) finishStream();
  },speed);
}
function stripTags(s){ return String(s); }

function generateTitle(text){
  let t = text.trim().replace(/^@\w+\s*/i, "").trim();
  const words = t.replace(/[?!.,;:]+/g, " ").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "Новый чат";
  let title = words.slice(0, 4).join(" ");
  if (title.length > 36) title = title.slice(0, 33) + "…";
  return title.charAt(0).toUpperCase() + title.slice(1);
}

const WEATHER_WORDS = ["погод","температур","дожд","снег","солнечн","облачн","тепл","холодн","ветрен"];
function extractCity(text){
  const stop = /^(сегодня|завтра|сейчас|мире|целом|общем|этом|моем|моём)$/i;
  let m = text.match(/(?:^|[^\p{L}])(?:в|во|для)\s+([\p{L}][\p{L}\-]+)/iu);
  if (m && !stop.test(m[1])) return m[1];
  m = text.match(/погода\s+([\p{L}][\p{L}\-]+)/iu);
  if (m && !stop.test(m[1])) return m[1];
  const words = text.replace(/[?!.,]/g,"").split(/\s+/);
  for (const w of words){ if (WEATHER_DB[resolveCity(w)]) return w; }
  return null;
}

function botReplySync(raw){
  let text = raw.trim();
  if (!text) return null;
  const lower = text.toLowerCase().replace(/ё/g,"е");
  const dot = getCurrentDot();

  if (lower.length <= 40 && /^(привет|здравств|хай|hi|hello|добрый|салют|ку|прив|приветик|доброе\s+утро|добрый\s+день|добрый\s+вечер|йо|нихао|хеллоу|приветствую|здарова|здорово)(?![\p{L}\p{N}])/iu.test(lower)){
    if (dot){
      const greetings = {
        teach: "Привет. Я "+dot.name+". Готов объяснять, искать факты и считать.",
        pinky: "Хей! Я Пинки. Давай про музло, вайб или что-то эстетичное.",
        dro: "Привет. Я Дро. Помогу с визуалом, нарисую что-нибудь.",
        froggy: "Йо! Я Фрогги. Погнали в нишевую науку — только с мемами.",
      };
      return { text: greetings[dot.classId] || greetings.teach };
    }
    return { text: "Привет! Я check. Могу искать информацию, считать, проверять текст, переводить, генерировать картинки. С чего начнём?" };
  }
  if (/^(спасибо|благодарю|спс|thanks|thx)/iu.test(lower)) return { text: pick(["Пожалуйста!","Рад помочь!","Обращайся."]) };
  if (/^(пока|до свидания|удачи|bye)(?![\p{L}])/iu.test(lower)) return { text: "Пока! Заходи ещё." };
  if (/^(как дела|как ты|как жизнь|как настроение)/i.test(lower)){
    if (dot && dot.classId === "pinky") return { text: "Всё вайбово! А у тебя как?" };
    if (dot && dot.classId === "froggy") return { text: "Нишево! А ты как, челик?" };
    return { text: "У меня всё отлично! А у тебя как?" };
  }
  if (/^(кто ты|ты кто|как тебя зовут)/i.test(lower)){
    if (dot) return { text: "Я " + dot.name + ". " + dot.desc };
    return { text: "Я check — быстрый российский ИИ." };
  }
  if (/^(что ты умеешь|помощь|help|команды|что можешь)/i.test(lower)){
    return { text: "Могу: искать, объяснять, считать, переводить, рисовать картинки, ставить таймер, показывать погоду. Команды: @help" };
  }
  const nameMatch = lower.match(/меня зовут\s+([а-яёa-z\-]+)/i);
  if (nameMatch){
    memory.userName = nameMatch[1].charAt(0).toUpperCase()+nameMatch[1].slice(1); ls.set("check_username", memory.userName);
    return { text: "Приятно познакомиться, "+memory.userName+"!" };
  }

  const cmdMatch = text.match(/^@(teach|weather|help|tr|qr|timer|define|quote|present)\b\s*(.*)$/i);
  if (cmdMatch){
    const cmd = cmdMatch[1].toLowerCase();
    const rest = cmdMatch[2].trim();
    if (cmd === "help") return { text: "Команды: @teach, @tr, @qr, @timer, @weather" };
    if (cmd === "tr"){ if (!rest) return { text: "Напиши текст после @tr." }; const hasCyr = /[а-яё]/i.test(rest); return { async: "translate", query: rest, from: hasCyr ? "ru" : "en", to: hasCyr ? "en" : "ru" }; }
    if (cmd === "qr"){ if (!rest) return { text: "Напиши текст после @qr." }; return { async: "qr", query: rest }; }
    if (cmd === "timer"){
      if (!rest) return { text: "Например: @timer 5м" };
      const m = rest.match(/(\d+)\s*(с|сек|м|мин|ч|час)/i);
      if (!m) return { text: "Пример: @timer 5м" };
      const n = parseInt(m[1]); const unit = m[2].toLowerCase();
      let secs = n;
      if (unit.startsWith("м") || unit.startsWith("min")) secs = n * 60;
      if (unit.startsWith("ч") || unit.startsWith("час")) secs = n * 3600;
      if (secs < 1) return { text: "Укажи время больше нуля." };
      if (secs > 3600) return { text: "Слишком долго." };
      return { async: "timer", seconds: secs, label: n + (unit.startsWith("с") ? " сек" : unit.startsWith("м") ? " мин" : " ч") };
    }
    if (cmd === "quote") return { text: "«Единственный способ делать великую работу — любить то, что делаешь». — Стив Джобс" };
    if (cmd === "weather"){
      if (rest) return { async: "weather", city: rest };
      memory.state.awaiting = { kind: "city" };
      return { text: "Погоду в каком городе?" };
    }
    if (cmd === "teach"){
      if (!rest) return { text: "Напиши тему после @teach." };
      return { async: "donor", query: "Объясни тему подробно и по шагам: " + rest };
    }
    if (cmd === "present"){
      if (!dot || dot.classId !== "teach") return { text: "@present — тестовый режим, доступен только у Тича." };
      if (!rest) return { text: "Напиши тему: @present тема презентации" };
      return { async: "present", query: rest };
    }
  }

  if (memory.state.awaiting && memory.state.awaiting.kind === "city"){
    const c = text.trim().replace(/[?!.]+$/,"");
    if (c.length >= 2 && c.length <= 40){
      memory.state.awaiting = null;
      return { async: "weather", city: c };
    }
    memory.state.awaiting = null;
  }

  if (WEATHER_WORDS.some(w=>lower.includes(w))){
    const city = extractCity(text);
    if (city) return { async: "weather", city };
    memory.state.awaiting = { kind: "city" };
    return { text: "Погоду в каком городе?" };
  }

  if (dot && dot.classId === "pinky" && /(чарт|топ[\s-]*\d*\s*(трек|песен|музык)|что в чартах)/i.test(lower)) return { text: PINKY_CHART_MD };

  const drawM = text.match(/^(?:нарисуй|изобрази)\s+(.+)/iu);
  if (drawM) return { async: "image", query: drawM[1].trim() };
  if (/(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк|изображени|фото|рисунок|арт)/i.test(lower)){
    const prompt = text.replace(/^(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк[уи]?|изображени[ея]?|фото|рисунок|арт)\s*/i, "").trim();
    return { async: "image", query: prompt || "красивый пейзаж" };
  }


  if (/(шутк|анекдот|рассмеши|пошути|смешн)/i.test(lower)){
    if (dot){
      const cls = DOTS_CLASSES[dot.classId];
      if (cls && cls.jokes && cls.jokes.length) return { text: applyDotToText(pick(cls.jokes)) };
    }
    return { text: "Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 == DEC 25." };
  }
  if (/(факт|интересное|расскажи что-нибудь|удиви)/i.test(lower)){
    if (dot){
      const cls = DOTS_CLASSES[dot.classId];
      if (cls && cls.facts && cls.facts.length) return { text: applyDotToText(pick(cls.facts)) + applyDotToText(maybeDotFlavor(dot.classId)) };
    }
    return { text: "Мёд не портится: археологи находили съедобный мёд в гробницах возрастом 3000 лет." };
  }
  if (/(цитат|мотивир|вдохнови)/i.test(lower)){
    return { text: "«Простота — высшая форма изысканности». — Леонардо да Винчи" };
  }

  const defMatch = text.match(/^(?:кто такой|кто такая|кто такие|что такое|определение|что значит|расскажи про|расскажи о|расскажи об)\s+(.+?)[?!.]*$/i);
  if (defMatch && defMatch[1].trim().length >= 2 && defMatch[1].trim().length <= 80){
    return { async: "searchOrDonor", query: defMatch[1].trim(), original: text };
  }

  return { async: "donor", query: text };
}

    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      const ok = await handleSearch(reply.query);
      if (!ok) await handleDonor(reply.original || reply.query);
    }, 200);
    return;
  }
  if (reply.async === "donor"){
    showTypingIndicator();
    setTimeout(async ()=>{
      hideTypingIndicator();
      await handleDonor(reply.query);
    }, 200);
    return;
  }
  if (reply.async === "present"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handlePresent(reply.query); }, 200); return; }
  if (reply.async === "fix"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleFix(reply.query); }, 200); return; }
  if (reply.async === "translate"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleTranslate(reply.query, reply.from, reply.to); }, 200); return; }
  if (reply.async === "qr"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleQr(reply.query); }, 200); return; }
  if (reply.async === "timer"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleTimer(reply.seconds, reply.label); }, 200); return; }
  if (reply.async === "gdz"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleGdz(reply.query); }, 300); return; }
  if (reply.async === "wolfram"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleWolfram(reply.query); }, 300); return; }
  if (reply.async === "image"){ showTypingIndicator(); setTimeout(()=>{ hideTypingIndicator(); handleImage(reply.query); }, 300); return; }
  if (reply.async === "weather"){ showTypingIndicator(); setTimeout(async ()=>{ hideTypingIndicator(); await handleWeather(reply.city); }, 200); return; }

  if (!reply.text || !reply.text.trim()) return;
  showTypingIndicator();
  setTimeout(()=>{
    hideTypingIndicator();
    const botEl = document.createElement("div");
    botEl.className = "msg bot";
    if (isViewing()) messagesEl.appendChild(botEl);
    let textHtml = renderMd(applyDotToText(reply.text));
    streamText(botEl, textHtml, ()=>{
      persistMessage("bot", textHtml);
    });
  }, 200 + Math.random()*300);
}

function prepImage(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const m=Math.max(im.width,im.height),k=m<1500?1500/m:Math.min(1,2400/m),w=Math.round(im.width*k),h=Math.round(im.height*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data,g=new Uint8Array(w*h);let lo=255,hi=0;
    for(let i=0,j=0;i<p.length;i+=4,j++){const v=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;g[j]=v;if(v<lo)lo=v;if(v>hi)hi=v;}
    const r=Math.max(1,hi-lo);
    for(let i=0,j=0;i<p.length;i+=4,j++){const v=Math.min(255,Math.max(0,((g[j]-lo)*255/r-128)*1.25+128));p[i]=p[i+1]=p[i+2]=v;}
    x.putImageData(d,0,0);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file);},"image/png");}catch(e){res(file);}};
  im.onerror=()=>res(file);im.src=u;});}

   +'.neon .s{background:#0b0f1f;color:#e8f9ff}.neon .s.v1{background:#150a2e}.neon .t{color:#3df5ff;font-family:Verdana,Geneva,sans-serif;letter-spacing:-1px;text-shadow:0 0 22px rgba(61,245,255,.5)}.neon .a{color:#ff4fd8;font-family:"Courier New",monospace;font-style:normal}.neon .cd{background:rgba(61,245,255,.1);border:2px solid #3df5ff}.neon .pic{border:3px solid #ff4fd8}'

   +'.ocean .s{background:#0b3c5d;color:#f1faff}.ocean .s.v1{background:#f1faff;color:#0b3c5d}.ocean .t{font-family:Georgia,serif;letter-spacing:-1px}.ocean .a{color:#8fd3ff}.ocean .s.v1 .a{color:#2a7fb8}.ocean .cd{background:rgba(143,211,255,.18)}.ocean .s.v1 .cd{background:#0b3c5d;color:#f1faff}'

}
async function wikiPic(q){try{const r=await Promise.race([fetchWikipedia(q,false),new Promise(r=>setTimeout(()=>r(null),7000))]);return r&&r.image?r.image:null;}catch(e){return null;}}
async function handlePresent(topic){
  const statusEl=addStatus("Пишу презентацию..."),progress=startProgress(statusEl,"Пишу презентацию");
  const raw=await askDonor("Тема презентации: "+topic,{sys:PRESENT_SYS,noHistory:true,max:2600});
  let pr=raw?parseSlides(raw):{person:false,slides:[]};const slides=pr.slides;
  if(slides.length>=3){
    updateStatus(statusEl,"Подбираю фото...");
    const used=new Set();
    await Promise.all(slides.map(async(sl,i)=>{
      let q=null;
      if(i===0&&(pr.person||sl.photo))q=sl.photo||topic; else if(sl.photo)q=sl.photo; else if(i%2===1&&["text","cards","steps"].includes(sl.type))q=sl.title;
      if(!q)return; const u=await wikiPic(q); if(u&&!used.has(u)){used.add(u);sl.img=u;}
    }));
  }
  progress.stop();statusEl.remove();
  const botEl=addMsg("","bot");let html;
  if(slides.length<3)html='Не получилось собрать слайды.<div><button class="expand-btn pres-retry" data-p="'+encodeURIComponent(topic)+'">Повторить</button></div>';
  else{const d=encodeURIComponent(JSON.stringify({person:pr.person,slides}));
    html='<b>Презентация «'+escapeHtml(topic)+'»</b><br>'+slides.length+' слайдов'+(slides.some(x=>x.img)?', с фото':'')+'. Выбери стиль:<div class="pres-row" data-s="'+d+'">'+PRES_THEMES.map(t=>'<button class="expand-btn pres-btn" data-th="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';}
  streamText(botEl,html,()=>{persistMessage("bot",html);});
}
messagesEl.addEventListener("click",e=>{
  const b=e.target.closest(".pres-btn");
  if(b){try{const src=b.dataset.s?b:b.closest(".pres-row"),dt=JSON.parse(decodeURIComponent(src.dataset.s)),sl=Array.isArray(dt)?dt:dt.slides;
    const u=URL.createObjectURL(new Blob([presDoc(sl,b.dataset.th)],{type:"text/html"}));
    if(!window.open(u,"_blank"))showToast("Разреши всплывающие окна");}catch(err){showToast("Не удалось открыть презентацию");}return;}
  const r=e.target.closest(".pres-retry");
  if(r){r.disabled=true;replyChatId=currentChatId;handlePresent(decodeURIComponent(r.dataset.p));}
});


init();
showPrivacy();
if (!ls.persistent) setTimeout(()=> showToast("Память браузера недоступна: чаты сохранятся до закрытия страницы"), 700);
</script>

<script>
/* ============================================================
   v17: жесты, навигация, плавность
   ============================================================ */
(function(){
const hap=n=>{try{navigator.vibrate&&navigator.vibrate(n||8)}catch(e){}};
const home=document.getElementById("home-screen"),chat=document.getElementById("chat-screen");

/* системное «назад» (кнопка/жест Android, браузер) закрывает верхний слой */
window.N={stack:[],skip:0,pop:false,
  open(k){ if(this.stack.some(s=>s.k===k))return; let ok=false; try{history.pushState({v:1},"");ok=true}catch(e){} this.stack.push({k,ok}); },
  closed(k){ const i=this.stack.map(s=>s.k).lastIndexOf(k); if(i<0)return; const s=this.stack.splice(i,1)[0]; if(this.pop||!s.ok)return; this.skip++; try{history.back()}catch(e){this.skip--} }
};
addEventListener("popstate",()=>{
  if(N.skip>0){N.skip--;return}
  const t=N.stack[N.stack.length-1]; if(!t)return;
  const o=document.querySelector(".ctx-overlay:not(.out)");
  if(o){ o.remove(); try{history.pushState({v:1},"")}catch(e){} return; }
  N.pop=true;
  try{ t.k==="sheet"?closeSheet():t.k==="search"?closeSearch():goHome(); }finally{N.pop=false}
});

/* жест «назад»: свайп от левого края в чате */
let g=null;
function gm(e){
  if(!g)return; const t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
  if(!g.on){
    if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){ge();return}
    if(dx<10)return;
    g.on=true; chat.classList.add("drag"); home.classList.add("drag","peek");
    try{document.activeElement.blur()}catch(_){}
  }
  const now=Date.now(); g.v=(t.clientX-g.lx)/Math.max(1,now-g.lt); g.lx=t.clientX; g.lt=now;
  const d=Math.max(0,dx),p=Math.min(1,d/g.W); g.d=d;
  chat.style.transform="translate3d("+d+"px,0,0)";
  home.style.transform="translate3d("+(-26*(1-p))+"%,0,0)"; home.style.opacity=.6+.4*p;
  if(e.cancelable)e.preventDefault();
}
function ge(){
  document.removeEventListener("touchmove",gm);
  const s=g; g=null; if(!s||!s.on)return;
  const go=s.d>s.W*.33||s.v>.55;
  chat.classList.remove("drag"); home.classList.remove("drag");
  chat.style.transform=""; home.style.transform=""; home.style.opacity="";
  if(go){hap(10);goHome()}
  setTimeout(()=>home.classList.remove("peek"),480);
}
document.addEventListener("touchstart",e=>{
  g=null;
  if(chat.classList.contains("hidden")||e.touches.length>1)return;
  if(document.querySelector(".sheet-overlay:not(.out),.ctx-overlay:not(.out)"))return;
  const t=e.touches[0]; if(t.clientX>28)return;
  g={x:t.clientX,y:t.clientY,lx:t.clientX,lt:Date.now(),v:0,d:0,on:false,W:innerWidth};
  document.addEventListener("touchmove",gm,{passive:false});
},{passive:true});
document.addEventListener("touchend",ge);document.addEventListener("touchcancel",ge);

/* модалки смахиваются вниз с любого места, а у верхней кромки — особенно легко */
let S=null;
function sm(e){
  if(!S)return; const t=e.touches[0],d=t.clientY-S.y;
  if(!S.inside){ if(d>24){const s=S;S=null;s.ov.removeEventListener("touchmove",sm);closeSheet()} return; }
  if(!S.on){
    if(d<6)return;
    if(S.sh.scrollTop>0||e.target.closest("input,textarea,.tbl,pre"))return;
    S.on=true;
  }
  const now=Date.now(); S.v=(t.clientY-S.ly)/Math.max(1,now-S.lt); S.ly=t.clientY; S.lt=now;
  S.d=Math.max(0,d); S.sh.style.transition="none";
  S.sh.style.transform="translate3d(0,"+S.d+"px,0)";
  S.ov.style.background="rgba(0,0,0,"+(.32*(1-Math.min(1,S.d/380)))+")";
  if(e.cancelable)e.preventDefault();
}
function se(){
  if(!S)return; const s=S; S=null; s.ov.removeEventListener("touchmove",sm); if(!s.on)return;
  if(s.d>64||(s.v>.35&&s.d>14)){ hap(8); closeSheet(); }
  else{
    s.sh.style.transition="transform .42s cubic-bezier(.2,.9,.3,1.12)"; s.sh.style.transform=""; s.ov.style.background="";
    setTimeout(()=>{s.sh.style.transition=""},440);
  }
}
document.addEventListener("touchstart",e=>{
  const ov=e.target.closest&&e.target.closest(".sheet-overlay:not(.out)"); if(!ov){S=null;return}
  const sh=ov.querySelector(".sheet"),t=e.touches[0];
  S={ov,sh,y:t.clientY,ly:t.clientY,lt:Date.now(),v:0,d:0,on:false,inside:sh.contains(e.target)};
  ov.addEventListener("touchmove",sm,{passive:false});
},{passive:true});
document.addEventListener("touchend",se);document.addEventListener("touchcancel",se);

/* закрытие модалок и меню — с анимацией, а не мгновенно */
const _rm=Element.prototype.remove;
Element.prototype.remove=function(){
  const c=this.classList;
  if(c&&(c.contains("sheet-overlay")||c.contains("ctx-overlay"))&&!this._out){
    this._out=1; this.removeAttribute("id"); c.add("out");
    setTimeout(()=>_rm.call(this),c.contains("sheet-overlay")?330:200); return;
  }
  _rm.call(this);
};

/* автопрокрутка при печати ответа — только если читатель внизу (не тянет назад) */
window.softScroll=function(){ const s=document.getElementById("screen"); if(s.scrollHeight-s.scrollTop-s.clientHeight<170) s.scrollTop=s.scrollHeight; };

/* топбар-стекло при прокрутке, каскад карточек при запуске, лёгкий отклик */
const tb=home.querySelector(".home-topbar");
home.addEventListener("scroll",()=>tb.classList.toggle("scrolled",home.scrollTop>6),{passive:true});
const cc=document.getElementById("chats-container");
cc.querySelectorAll(".chat-card").forEach((c,i)=>c.style.setProperty("--i",Math.min(i,9)));
cc.querySelectorAll(".chats-grid").forEach(x=>x.classList.add("enter"));
setTimeout(()=>cc.querySelectorAll(".chats-grid.enter").forEach(x=>x.classList.remove("enter")),1100);
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest("#send,.dots-popover-item,.fab"))hap(6); },true);
})();
</script>
