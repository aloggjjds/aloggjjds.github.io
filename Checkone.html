<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>check — быстрый ИИ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f0f1f3;
    --bg-grad: #f0f1f3;
    --card: #ffffff;
    --text: #0a0a0a;
    --text-dim: #6b6b70;
    --text-mute: #8e8e93;
    --text-soft: #9a9a9f;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.72) 100%);
    --glass-border: rgba(255,255,255,0.65);
    --glass-shadow-1: rgba(255,255,255,0.85);
    --glass-shadow-2: rgba(0,0,0,0.08);
    --bot-bg: linear-gradient(135deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.88) 100%);
    --bot-border: rgba(255,255,255,0.55);
    --chip-bg: rgba(255,255,255,0.85);
    --input-placeholder: #8e8e93;
    --hairline: rgba(0,0,0,0.06);
  }
  html.dark {
    --bg: #0a0a0c;
    --bg-grad: #0a0a0c;
    --card: #16161a;
    --text: #f5f5f7;
    --text-dim: #b0b0b8;
    --text-mute: #7a7a82;
    --text-soft: #6a6a72;
    --glass-bg: linear-gradient(135deg, rgba(40,40,46,0.75) 0%, rgba(30,30,36,0.55) 45%, rgba(38,38,44,0.72) 100%);
    --glass-border: rgba(255,255,255,0.10);
    --glass-shadow-1: rgba(255,255,255,0.10);
    --glass-shadow-2: rgba(0,0,0,0.35);
    --bot-bg: linear-gradient(135deg, rgba(40,40,46,0.85) 0%, rgba(28,28,34,0.75) 60%, rgba(38,38,44,0.85) 100%);
    --bot-border: rgba(255,255,255,0.08);
    --chip-bg: rgba(40,40,46,0.75);
    --input-placeholder: #7a7a82;
    --hairline: rgba(255,255,255,0.08);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overscroll-behavior: none; overflow: hidden;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    transition: background .25s, color .25s;
  }
  body { display: flex; flex-direction: column; }
  svg { display: block; }

  .glass {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 1px 0 var(--glass-shadow-1) inset,
      0 -1px 0 rgba(0,0,0,0.04) inset,
      0 8px 32px var(--glass-shadow-2),
      0 2px 8px rgba(0,0,0,0.04);
    transition: background .25s, border .25s;
  }
  .glass::before {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 35%);
    pointer-events: none;
  }
  html.dark .glass::before { background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 35%); }

  #home-screen {
    flex: 1; overflow-y: auto;
    padding: 0 14px 140px 14px;
    -webkit-overflow-scrolling: touch;
    display: block; background: var(--bg);
  }
  #home-screen.hidden { display: none; }

  .home-topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 2px 10px 2px;
    background: linear-gradient(to bottom, var(--bg) 65%, transparent);
  }
  .home-topbar .home-actions { display: flex; gap: 8px; }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: transform .12s;
  }
  .menu-btn:active { transform: scale(.93); }

  .date-group { margin-bottom: 16px; }
  .date-label {
    font-size: 15px; font-weight: 400;
    color: var(--text-mute); letter-spacing: -0.2px;
    padding: 10px 4px 8px 4px;
  }
  .chats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }
  .chat-card {
    border-radius: 26px;
    cursor: pointer;
    transition: transform .15s;
    position: relative;
    overflow: hidden;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    background: var(--card);
    box-shadow:
      0 1px 0 var(--glass-shadow-1) inset,
      0 6px 22px rgba(0,0,0,0.055),
      0 1px 3px rgba(0,0,0,0.04);
    border: 1px solid var(--hairline);
    user-select: none;
    -webkit-user-select: none;
    width: 100%;
    box-sizing: border-box;
  }
  .chat-card:active { transform: scale(.975); }
  .chat-card .card-body {
    padding: 14px 16px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  .chat-card .card-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.08;
    letter-spacing: -0.85px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
    width: 100%;
  }
  .chat-card .card-preview {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.32;
    font-weight: 400;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
    letter-spacing: -0.15px;
    width: 100%;
  }

  .fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 64px; height: 64px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 15;
    transition: transform .12s;
  }
  .fab:active { transform: scale(.92); }
  .fab-search { left: 20px; color: var(--text); }
  .fab-new {
    right: 20px; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.14) inset, 0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.10);
  }

  /* Контекстное меню */
  .ctx-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.30);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 24px; animation: fadeIn .18s ease;
  }
  .ctx-overlay.visible { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } }
  .ctx-menu {
    width: 100%; max-width: 300px;
    border-radius: 20px; padding: 6px;
    animation: popIn .22s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .ctx-title {
    padding: 10px 14px 6px 14px;
    font-size: 12px; color: var(--text-mute);
    font-weight: 500; letter-spacing: 0.2px;
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 12px;
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text);
    transition: background .12s;
    letter-spacing: -0.15px;
  }
  .ctx-item:active { background: rgba(127,127,127,0.15); }
  .ctx-item.danger { color: #ff3b30; }
  .ctx-item svg { flex-shrink: 0; opacity: 0.85; width: 17px; height: 17px; }
  .ctx-sep { height: 1px; background: var(--hairline); margin: 4px 10px; }

  /* Поиск */
  .search-panel {
    position: fixed; inset: 0; z-index: 90;
    background: var(--bg);
    display: none;
    flex-direction: column;
    animation: fadeIn .18s ease;
  }
  .search-panel.visible { display: flex; }
  .search-topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px 10px 14px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .search-input-wrap {
    flex: 1; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
  }
  .search-input-wrap input {
    flex: 1; border: none; outline: none;
    font-size: 16px; font-family: inherit;
    background: transparent; color: var(--text);
  }
  .search-results { flex: 1; overflow-y: auto; padding: 8px 14px 40px 14px; }
  .search-item {
    padding: 12px 14px;
    background: var(--card);
    border-radius: 16px; margin-bottom: 8px;
    cursor: pointer;
    border: 1px solid var(--hairline);
  }
  .search-item:active { transform: scale(.99); }
  .search-item .si-title {
    font-size: 16px; font-weight: 600; color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .search-item .si-preview {
    font-size: 13px; color: var(--text-mute);
    line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .search-item mark {
    background: rgba(10,132,255,0.2); color: inherit;
    border-radius: 3px; padding: 0 2px;
  }

  /* ===== ЧАТ ===== */
  #chat-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  #chat-screen.hidden { display: none; }

  .topbar {
    display: grid; grid-template-columns: 52px 1fr 52px;
    align-items: center; gap: 12px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 75%, transparent);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    z-index: 10;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: transform .1s;
  }
  .icon-btn:active { transform: scale(.93); }
  .chat-title {
    text-align: center; font-size: 16px; font-weight: 600;
    color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 8px; letter-spacing: -0.35px;
  }

  #screen { flex: 1; overflow-y: auto; padding: 8px 16px 160px 16px; -webkit-overflow-scrolling: touch; }
  .welcome {
    min-height: 45vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 22px; color: var(--text-mute);
  }
  .welcome .logo { width: 62px; height: 62px; color: var(--text); opacity: .9; }
  .welcome h1 {
    font-size: 19px; font-weight: 500; line-height: 1.35;
    margin: 0; max-width: 300px; color: var(--text-dim); letter-spacing: -0.4px;
  }
  .welcome-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; max-width: 340px;
    margin-top: 4px;
  }
  .welcome-chips .chip { font-size: 13px; }

  #messages { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
  .msg {
    max-width: 86%; padding: 11px 15px; border-radius: 22px;
    line-height: 1.5; font-size: 15px;
    word-wrap: break-word;
    animation: msgIn .22s cubic-bezier(.2,.9,.3,1);
    letter-spacing: -0.15px;
    transition: transform .12s;
  }
  .msg.bot { cursor: pointer; }
  .msg.bot:active { transform: scale(.995); }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .user {
    align-self: flex-end; color: #ffffff;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    border-bottom-right-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 2px 12px rgba(10,10,10,0.20);
    white-space: pre-wrap;
  }
  .bot {
    align-self: flex-start; color: var(--text);
    background: var(--bot-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom-left-radius: 8px;
    box-shadow:
      0 1px 0 var(--glass-shadow-1) inset,
      0 4px 18px rgba(0,0,0,0.055),
      0 1px 3px rgba(0,0,0,0.03);
    border: 1px solid var(--bot-border);
  }
  .msg a { color: #0a84ff; text-decoration: none; }
  .msg .src {
    display: block; margin-top: 8px; font-size: 12px;
    color: var(--text-mute); line-height: 1.4;
  }
  .msg .src a { color: var(--text-mute); text-decoration: none; }

  .expand-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 14px;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text); cursor: pointer;
    transition: background .15s, transform .1s;
    letter-spacing: -0.2px; font-family: inherit;
  }
  .expand-btn:hover { background: color-mix(in srgb, var(--bg) 90%, transparent); }
  .expand-btn:active { transform: scale(.97); }
  .expand-btn svg { flex-shrink: 0; }

  .chips-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 12px; animation: msgIn .22s ease;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px;
    background: var(--chip-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    color: var(--text); cursor: pointer; font-family: inherit;
    transition: background .15s, transform .1s;
    letter-spacing: -0.2px; white-space: nowrap;
    box-shadow: 0 1px 0 var(--glass-shadow-1) inset, 0 2px 8px rgba(0,0,0,0.04);
  }
  .chip:hover { background: color-mix(in srgb, var(--chip-bg) 80%, var(--text) 5%); }
  .chip:active { transform: scale(.96); }
  .chip svg { opacity: 0.7; flex-shrink: 0; }

  .fraction {
    display: inline-flex; flex-direction: column; align-items: center;
    vertical-align: middle; margin: 0 2px;
    font-size: 0.85em; line-height: 1.1;
    position: relative; top: -0.05em;
  }
  .fraction .num { border-bottom: 1.5px solid currentColor; padding: 0 4px 1px 4px; }
  .fraction .den { padding: 1px 4px 0 4px; }

  .wiki-img-wrap {
    display: inline-block; margin: 4px 0 10px 0;
    border-radius: 14px; overflow: hidden;
    background: #eef0f3; line-height: 0;
    max-width: 220px;
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
    animation: msgIn .25s ease;
  }
  .wiki-img {
    display: block; max-width: 100%; max-height: 220px;
    width: auto; height: auto; background: #eef0f3;
    opacity: 0; transition: opacity .3s; cursor: pointer;
  }
  .wiki-img.loaded { opacity: 1; }

  .qr-wrap {
    display: inline-block; margin: 8px 0;
    padding: 10px; background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
  }
  .qr-wrap img { display: block; width: 180px; height: 180px; }

  .timer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px;
    background: var(--bot-bg);
    border-radius: 16px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.5px;
  }
  .timer-badge svg { opacity: 0.7; }
  .timer-badge.done { color: #ff3b30; }

  .cursor {
    display: inline-block; width: 7px; height: 15px;
    background: var(--text); margin-left: 2px; vertical-align: -2px;
    animation: blink .9s steps(2,start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  .dots span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    background: #c0c0c5; border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){ animation-delay: .15s; }
  .dots span:nth-child(3){ animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity:.5; }
    30% { transform: translateY(-4px); opacity:1; }
  }

  .status-line {
    font-size: 13px; color: var(--text-mute);
    padding: 4px 2px; display: flex; align-items: center; gap: 8px;
    animation: msgIn .18s ease;
  }
  .status-line .spin {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid #d8d8dc; border-top-color: var(--text);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  .status-line svg { flex-shrink: 0; opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .uploaded-img {
    display: block; max-width: 180px; max-height: 180px;
    border-radius: 14px; margin-top: 6px; object-fit: cover;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(100px + env(safe-area-inset-bottom));
    padding: 10px 18px;
    background: rgba(20,20,22,0.92);
    color: #fff;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    z-index: 200;
    animation: toastIn .22s cubic-bezier(.2,.9,.3,1.1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    pointer-events: none;
    letter-spacing: -0.15px;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ===== КОМПОЗЕР ===== */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, transparent);
    z-index: 10;
  }
  .pill {
    display: flex; align-items: center; gap: 8px;
    border-radius: 999px;
    padding: 6px 6px 6px 12px;
    position: relative;
  }
  .pill-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); flex-shrink: 0;
    transition: background .15s;
    font-size: 19px; font-weight: 500;
  }
  .pill-btn:active { background: rgba(127,127,127,0.15); }

  .pill-btn.at-btn {
    border: none; background: transparent;
    width: 36px; height: 36px;
    font-size: 26px; font-weight: 500;
    color: var(--text); line-height: 1;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s;
  }
  .pill-btn.at-btn.active { color: #0a84ff; transform: scale(1.05); }
  .pill-btn.at-btn:active { transform: scale(.92); }
  .pill-btn.mic-btn.recording { color: #ff3b30; animation: pulseRec 1s infinite; }
  @keyframes pulseRec {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  #input {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 16px; line-height: 1.3; max-height: 90px;
    font-family: inherit; color: var(--text); background: transparent;
    padding: 6px 0; min-width: 0;
  }
  #input::placeholder { color: var(--input-placeholder); }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: transform .1s, opacity .15s;
    opacity: .4;
    background: linear-gradient(135deg, #2a2a2e 0%, #0a0a0a 50%, #1a1a1e 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 2px 12px rgba(10,10,10,0.20);
  }
  .send-btn.visible { opacity: 1; }
  .send-btn:active { transform: scale(.94); }
  .send-btn.stop { background: #ff3b30; opacity: 1; box-shadow: 0 2px 12px rgba(255,59,48,0.35); }

  .char-counter {
    font-size: 11px;
    color: var(--text-mute);
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity .15s;
  }
  .char-counter.visible { opacity: 1; }

  .cmd-panel {
    position: fixed; left: 14px; right: 14px;
    bottom: calc(90px + env(safe-area-inset-bottom));
    border-radius: 18px;
    padding: 6px;
    z-index: 20; max-height: 55vh; overflow-y: auto;
    display: none; animation: popIn .2s ease;
  }
  .cmd-panel.visible { display: block; }
  .cmd-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 12px;
    cursor: pointer; transition: background .15s;
  }
  .cmd-item:active { background: rgba(127,127,127,0.15); }
  .cmd-code {

const THEME_KEY = "check_theme_v1";
function applyTheme(dark){
  document.documentElement.classList.toggle("dark", !!dark);
  const icon = document.getElementById("theme-icon");
  if (icon){
    icon.innerHTML = dark
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  }
}
function initTheme(){
  let saved = localStorage.getItem(THEME_KEY);
  if (saved === null){
    const preferDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    saved = preferDark ? "dark" : "light";
    localStorage.setItem(THEME_KEY, saved);
  }
  applyTheme(saved === "dark");
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
const recentPhrases = [];
function noRepeat(a){
  const fresh = a.filter(x => !recentPhrases.includes(x));
  const chosen = pick(fresh.length ? fresh : a);
  recentPhrases.push(chosen);
  if (recentPhrases.length > 50) recentPhrases.shift();
  return chosen;
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function dateLabel(ts){
  const d = new Date(ts), now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const that = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - that) / 86400000);
  if (diff === 0) return "Сегодня";
  if (diff === 1) return "Вчера";
  const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  return d.getDate()+" "+months[d.getMonth()];
}
function showToast(text){
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 1600);
  setTimeout(()=>{ t.remove(); }, 2000);
}

const STORAGE_KEY = "check_chats_v6";
const CURRENT_KEY = "check_current_v6";
const PROFILE_KEY = "check_profile_v6";

function loadChats(){
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch { return []; }
}
function saveChats(chats){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); } catch {} }
function createChat(){
  const id = "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
  const chat = { id, title: "Новый чат", preview: "", cover: null, messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  const chats = loadChats(); chats.unshift(chat); saveChats(chats); return chat;
}
function getChat(id){ return loadChats().find(c => c.id === id) || null; }
function updateChat(id, patch){
  const chats = loadChats();
  const idx = chats.findIndex(c => c.id === id);
  if (idx === -1) return null;
  chats[idx] = { ...chats[idx], ...patch, updatedAt: Date.now() };
  saveChats(chats); return chats[idx];
}
function deleteChat(id){
  const chats = loadChats().filter(c => c.id !== id);
  saveChats(chats);
}
function loadProfile(){
  try { const raw = localStorage.getItem(PROFILE_KEY); return raw ? JSON.parse(raw) : { name: null, tone: "formal" }; }
  catch { return { name: null, tone: "formal" }; }
}
function saveProfile(p){ try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch {} }

const TITLE_TEMPLATES = [
  (k) => k, (k) => k + ": обзор", (k) => "Про " + k.toLowerCase(),
  (k) => k + " — коротко", (k) => "Всё о " + k.toLowerCase(), (k) => k + ": что важно",
  (k) => "Разбираем " + k.toLowerCase(), (k) => k + " в двух словах",
  (k) => "О " + k.toLowerCase(), (k) => k + " — детали",
];
function generateTitle(text){
  let t = text.trim();
  t = t.replace(/^@\w+\s*/i, "").trim();
  const lower = t.toLowerCase().replace(/ё/g,"е");
  for (const [kw, label] of Object.entries(TITLE_KEYWORDS)){
    if (lower.includes(kw)){
      const template = pick(TITLE_TEMPLATES);
      let title = template(label);
      const numMatch = t.match(/(?:номер|№|задани[ея]|упражнени[ея])\s*(\d+)/i);
      if (numMatch) title = label + " " + numMatch[1];
      return title;
    }
  }
  t = t.replace(/^(привет|здравствуйте|хай|hi|hello|добрый день|добрый вечер|доброе утро)[!.,\s]*/i, "");
  t = t.replace(/[?!.,;:]+/g, " ").trim();
  if (!t) return "Новый чат";
  const words = t.split(/\s+/).filter(Boolean);
  let title = words.slice(0, 4).join(" ");
  if (title.length > 36) title = title.slice(0, 33) + "…";
  return title.charAt(0).toUpperCase() + title.slice(1);
}

async function fetchWikipedia(query, full){
  const clean = query
    .replace(/^(что такое|кто такой|кто такая|кто такие|расскажи про|расскажи о|расскажи об|объясни|объясните|поясни|растолкуй|что значит|определение|что означает|что за|в чём смысл|в чем смысл)\s+/i, "")
    .replace(/[?!.]+$/,"").trim();
  if (!clean || clean.length > 120) return null;

  const getPage = async (lang, title) => {
    try {
      const exIntro = full ? "" : "&exintro=1";
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*`+
        `&prop=extracts|info|pageimages&inprop=url&explaintext=1&redirects=1`+
        `&piprop=thumbnail|name&pithumbsize=500`+exIntro+
        `&titles=${encodeURIComponent(title)}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data.query && data.query.pages;
      if (!pages) return null;
      const page = Object.values(pages)[0];
      if (!page || !page.extract || page.extract.length < 20) return null;
      let image = null;
      if (page.thumbnail && page.thumbnail.source){
        image = page.thumbnail.source;
        if (/\.svg$/i.test(image)) image = null;
      }
      return {
        title: page.title, extract: page.extract,
        url: page.fullurl || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`,
        lang, image,
      };
    } catch { return null; }
  };
  const search = async (lang, q) => {
    try {
      const url = `https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&list=search&srsearch=${encodeURIComponent(q)}&srlimit=1`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const hit = data.query && data.query.search && data.query.search[0];
      return hit ? hit.title : null;
    } catch { return null; }
  };

  for (const lang of ["ru","en"]){
    let r = await getPage(lang, clean);
    if (r) return r;
    const found = await search(lang, clean);
    if (found){ r = await getPage(lang, found); if (r) return r; }
  }
  const simplified = clean.replace(/\b(это|такое|значит|означает|определение|понятие)\b/gi, "").replace(/\s{2,}/g," ").trim();
  if (simplified && simplified !== clean){
    for (const lang of ["ru","en"]){
      const found = await search(lang, simplified);
      if (found){ const r = await getPage(lang, found); if (r) return r; }
    }
  }
  return null;
}
function cleanWikiText(text){
  return text
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F2FF}\u{FE0F}\u{200D}]/gu, "")
    .replace(/\s*\([^)]*\)/g, "")
    .replace(/\s*\[[^\]]*\]/g, "")
    .replace(/\s{2,}/g, " ")
    .replace(/\s*([.,;:!?])\s*/g, "$1 ")
    .trim();
}
function shortenWiki(text, maxLen = 500){
  let t = cleanWikiText(text).replace(/\s+/g," ").trim();
  if (t.length <= maxLen) return t;
  const cut = t.slice(0, maxLen);
  const lastDot = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
  if (lastDot > 180) return cut.slice(0, lastDot+1);
  return cut.trim() + "…";
}

    const res = await fetch(url);

  try {
    let query = "гдз";
    if (grade) query += " " + grade + " класс";
    if (subject) query += " " + subject;
    if (author) query += " " + author;
    if (num) query += " номер " + num;
    const url = `https://api.duckduckgo.com/?format=json&q=${encodeURIComponent(query)}&no_html=1&skip_disambig=1`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const results = [];
    if (data.AbstractURL && data.AbstractText){ results.push({ title: data.AbstractText.slice(0, 120), url: data.AbstractURL }); }
    if (data.Results && data.Results.length){
      data.Results.forEach(r => { if (r.FirstURL && r.Text) results.push({ title: r.Text, url: r.FirstURL }); });
    }
    if (data.RelatedTopics && data.RelatedTopics.length){
      data.RelatedTopics.forEach(rt => { if (rt.FirstURL && rt.Text) results.push({ title: rt.Text, url: rt.FirstURL }); });
    }
    return results.length ? results : null;
  } catch { return null; }
}

/* ============================================================
   МАТЕМАТИКА
   ============================================================ */
function safeMath(expr){
  if (!/^[\d+\-*/().\s^%]+$/.test(expr)) return null;
  let js = expr.replace(/\^/g,"**");
  try {
    const t = tokenize(js);
    const r = parseExpr(t);
    if (t.length) return null;
    if (typeof r!=="number" || !isFinite(r)) return null;
    return r;
  } catch { return null; }
}
function tokenize(s){
  const re = /\s*(\d+\.?\d*|\*\*|[+\-*/()%])/g; const out=[]; let m,last=0;
  while ((m=re.exec(s))) { if (m.index!==last) throw 0; out.push(m[1]); last=re.lastIndex; }
  if (last!==s.length) throw 0;
  return out;
}
function parseExpr(t){ let l=parseTerm(t); while (t[0]==="+"||t[0]==="-"){ const o=t.shift(); const r=parseTerm(t); l = o==="+"?l+r:l-r;} return l; }
function parseTerm(t){ let l=parsePow(t); while (t[0]==="*"||t[0]==="/"||t[0]==="%"){ const o=t.shift(); const r=parsePow(t); if(o==="*")l*=r; else if(o==="/")l/=r; else l%=r;} return l; }
function parsePow(t){ let b=parseFactor(t); if(t[0]==="**"){ t.shift(); const e=parsePow(t); return Math.pow(b,e);} return b; }
function parseFactor(t){
  const tok=t.shift();
  if (tok==="("){ const v=parseExpr(t); if(t.shift()!==")") throw 0; return v; }
  if (tok==="-") return -parseFactor(t);
  if (tok==="+") return parseFactor(t);
  const n=Number(tok); if (isNaN(n)) throw 0; return n;
}
function fmt(n){ return Number.isInteger(n) ? n : +n.toFixed(6); }
function extractMath(text){
  const m = text.match(/[-+]?\d[\d\s+\-*/().^%]*\d|[-+]?\d/);
  return m ? m[0].trim() : null;
}
function formatFractions(text){
  return text.replace(/(?<![\d\/])(\d+)\/(\d+)(?![\d\/])/g,
    (m,a,b)=>`<span class="fraction"><span class="num">${a}</span><span class="den">${b}</span></span>`);
}
function parseFractionExpression(text){
  const m = text.match(/(\d+)\s*\/\s*(\d+)\s*([+\-*])\s*(\d+)\s*\/\s*(\d+)/);
  if (!m) return null;
  const a=+m[1], b=+m[2], op=m[3], c=+m[4], d=+m[5];
  if (!b || !d) return null;
  let num, den;
  if (op==="+"){ num=a*d+c*b; den=b*d; }
  else if (op==="-"){ num=a*d-c*b; den=b*d; }
  else { num=a*c; den=b*d; }
  const gcd=(x,y)=>y?gcd(y,x%y):x;
  const g=gcd(Math.abs(num),Math.abs(den));
  return { num:num/g, den:den/g };
}
function convert(v, from, to){
  from = from.replace(/°/,"").toLowerCase();
  to = to.replace(/°/,"").toLowerCase();
  if ((from==="км" && to==="м") || (from==="km" && to==="m")) return fmt(v)+" км = "+fmt(v*1000)+" м";
  if (from==="м" && to==="км") return fmt(v)+" м = "+fmt(v/1000)+" км";
  if (from==="м" && to==="см") return fmt(v)+" м = "+fmt(v*100)+" см";
  if (from==="см" && to==="м") return fmt(v)+" см = "+fmt(v/100)+" м";
  if (from==="кг" && to==="г") return fmt(v)+" кг = "+fmt(v*1000)+" г";
  if (from==="г" && to==="кг") return fmt(v)+" г = "+fmt(v/1000)+" кг";
  if (from==="c" && to==="f") return fmt(v)+"°C = "+fmt(v*9/5+32)+"°F";
  if (from==="f" && to==="c") return fmt(v)+"°F = "+fmt((v-32)*5/9)+"°C";
  const rates = { "долл":90, "доллар":90, "usd":90, "евро":98, "eur":98, "рубл":1, "rub":1 };
  const fr = Object.keys(rates).find(k=>from.startsWith(k));
  const tr = Object.keys(rates).find(k=>to.startsWith(k));
  if (fr && tr) return fmt(v)+" "+fr+" ≈ "+fmt(v*rates[fr]/rates[tr])+" "+tr+" (условно)";
  return null;
}

function detectTopic(lower){
  let best = null, bestScore = 0;
  for (const t of TOPICS){
    let score = 0;
    for (const kw of t.keywords){
      if (lower.includes(kw)) score += kw.length;
    }
    if (score > bestScore){ bestScore = score; best = t; }
  }
  return bestScore >= 3 ? best : null;
}

const FOLLOWUP_PATTERNS = [
  { re: /^(а\s+)?почему\??$/i, kind: "why" },
  { re: /^(а\s+)?зачем\??$/i, kind: "why" },
  { re: /^(а\s+)?как\s+это\??$/i, kind: "how" },
  { re: /^(а\s+)?подробнее\??$/i, kind: "more" },
  { re: /^(а\s+)?ещё\??$/i, kind: "more" },
  { re: /^(а\s+)?дальше\??$/i, kind: "more" },
  { re: /^(расскажи\s+(мне\s+)?больше|ещё\s+расскажи)\??$/i, kind: "more" },
  { re: /^(а\s+)?а\s+если\??/i, kind: "whatif" },
  { re: /^(а\s+)?ты\s+как\s+думаешь\??$/i, kind: "opinion" },
  { re: /^(а\s+)?что\s+ты\s+(думаешь|выберешь|выбрал)\??$/i, kind: "opinion" },
  { re: /^(а\s+)?и\s+что\??$/i, kind: "so" },
  { re: /^(дай|подкинь)\s+(ещё\s+)?факт\??$/i, kind: "fact" },
];
function classifyFollowUp(t){
  const s = t.trim().toLowerCase().replace(/ё/g,"е");
  for (const p of FOLLOWUP_PATTERNS) if (p.re.test(s)) return p.kind;
  return null;
}
function isCorrection(t){ return /(не то|неправильно|неверно|не так|я не про|я не о|не об этом|не про это|ты не понял|не понял|мимо|глупость)/i.test(t); }
function isThanks(t){ return /(спасибо|благодар|thanks|спс|пасиб|круто|класс|супер|молодец)/i.test(t); }

function detectToneSwitch(t){
  if (/\b(ты|тебя|тебе|тобой|твой|твоя|твоё|твои)\b/i.test(t) && !/\bвы\b/i.test(t)) memory.tone = "informal";
  else if (/\b(вы|вас|вам|вами|ваш|ваша|ваше|ваши)\b/i.test(t)) memory.tone = "formal";
  const p = loadProfile(); p.tone = memory.tone; saveProfile(p);
}
function applyTone(text){
  if (memory.tone === "informal"){
    return text.replace(/\bВас\b/g,"тебя").replace(/\bвас\b/g,"тебя")
      .replace(/\bВам\b/g,"тебе").replace(/\bвам\b/g,"тебе")
      .replace(/\bВаш\b/g,"твой").replace(/\bваш\b/g,"твой")
      .replace(/\bваша\b/g,"твоя").replace(/\bваше\b/g,"твоё")
      .replace(/\bваши\b/g,"твои");
  }
  return text;
}
function topicResponse(topicObj){
  const fact = pick(topicObj.facts);
  const opinion = Math.random() < 0.4 ? pick(topicObj.opinions) : null;
  const followup = Math.random() < 0.35 ? pick(topicObj.followups) : null;
  const openers = [
    "О, "+topicObj.label+" — хорошая тема.",
    "Люблю про "+topicObj.label+".",
    "Кстати, про "+topicObj.label+" могу сказать вот что.",
    "Давай про "+topicObj.label+".",
    "Интересно, что ты об этом заговорил.",
    "Про "+topicObj.label+" — это ко мне.",
  ];
  const parts = [];
  if (Math.random() < 0.5) parts.push(pick(openers));
  parts.push(fact);
  if (opinion) parts.push(opinion);
  if (followup) parts.push(followup);
  return parts.join(" ");
}

  /* ===== 2. FOLLOW-UP ===== */
  const followKind = classifyFollowUp(text);
  if (followKind && memory.state.topic && memory.state.topic !== "greet"){
    memory.state.depth++;
    const r = followUpResponse(followKind);
    if (r.text) r.text = applyTone(r.text);
    return r;
  }

  /* ===== 3. КОРРЕКЦИЯ ===== */
  if (isCorrection(text)){
    return { text: pick([
      "Понял, я промахнулся. Переформулируй — я подстроюсь.",
      "Виноват. Скажи иначе, и я попробую снова.",
      "Ясно, не попал. Что именно ты имел в виду?",
    ])};
  }

  /* ===== 4. ОЖИДАНИЕ ===== */
  if (memory.state.awaiting){
    const a = memory.state.awaiting;
    if (a.kind === "city"){
      const c = text.trim().replace(/[?!.]+$/,"");
      if (c.length >= 2 && c.length <= 40){
        memory.state.awaiting = null;
        return { async: "weather", city: c };
      }
      memory.state.awaiting = null;
    }
  }

  /* ===== 5. @КОМАНДЫ ===== */
  const cmdMatch = text.match(/^@(teach|wiki|weather|math|gdz|help|fix|img|sum|tr|qr|timer|define|quote)\b\s*(.*)$/i);
  if (cmdMatch){
    const cmd = cmdMatch[1].toLowerCase();
    const rest = cmdMatch[2].trim();
    if (cmd === "help"){
      return { text: "Команды:<br><br>"+
        "<b>@teach</b> — объяснить тему<br>"+
        "<b>@wiki</b> — поиск знаний<br>"+
        "<b>@fix</b> — проверить текст<br>"+
        "<b>@sum</b> — краткое резюме<br>"+
        "<b>@tr</b> — перевод (ru↔en)<br>"+
        "<b>@math</b> — математика и физика<br>"+
        "<b>@img</b> — нарисовать картинку<br>"+
        "<b>@qr</b> — QR-код из текста<br>"+
        "<b>@timer</b> — таймер (например, 5м)<br>"+
        "<b>@define</b> — быстрое определение<br>"+
        "<b>@quote</b> — цитата<br>"+
        "<b>@gdz</b> — найти ГДЗ<br>"+
        "<b>@weather</b> — погода"
      };
    }
    if (cmd === "fix"){
      if (!rest) return { text: "Напиши текст после @fix." };
      return { async: "fix", query: rest };
    }
    if (cmd === "sum"){
      if (!rest) return { text: "Напиши текст после @sum — сделаю краткое резюме." };
      return { async: "summarize", query: rest };
    }
    if (cmd === "tr"){
      if (!rest) return { text: "Напиши текст после @tr. Например: <i>@tr hello world</i>" };
      // Определяем направление: если кириллица → en, иначе → ru
      const hasCyr = /[а-яё]/i.test(rest);
      return { async: "translate", query: rest, from: hasCyr ? "ru" : "en", to: hasCyr ? "en" : "ru" };
    }
    if (cmd === "qr"){
      if (!rest) return { text: "Напиши текст или ссылку после @qr." };
      return { async: "qr", query: rest };
    }
    if (cmd === "timer"){
      if (!rest) return { text: "Укажи время. Например: <i>@timer 5м</i> или <i>@timer 30с</i>" };
      const m = rest.match(/(\d+)\s*(с|сек|м|мин|ч|час)/i);
      if (!m) return { text: "Не понял время. Пример: <i>@timer 5м</i>" };
      const n = parseInt(m[1]);
      const unit = m[2].toLowerCase();
      let secs = n;
      if (unit.startsWith("м") || unit.startsWith("min")) secs = n * 60;
      if (unit.startsWith("ч") || unit.startsWith("час")) secs = n * 3600;
      if (secs > 3600) return { text: "Слишком долго. Максимум — час." };
      return { async: "timer", seconds: secs, label: n + (unit.startsWith("с") ? " сек" : unit.startsWith("м") ? " мин" : " ч") };
    }
    if (cmd === "define"){
      if (!rest) return { text: "Напиши слово после @define." };
      return { async: "search", query: rest };
    }
    if (cmd === "quote"){
      return { text: pick(QUOTES) };
    }
    if (cmd === "weather"){
      if (rest) return { async: "weather", city: rest };
      memory.state.awaiting = { kind: "city" };
      return { text: "Погоду в каком городе?" + (memory.citiesSeen.length ? " Могу по последним: " + memory.citiesSeen.slice(-3).join(", ") + "." : "") };
    }
    if (cmd === "math"){
      if (rest) return { async: "wolfram", query: rest };
      return { text: "Напиши выражение. Например: <i>интеграл от x^2</i>" };
    }
    if (cmd === "img"){
      if (!rest) return { text: "Опиши картинку после @img." };
      return { async: "pollinations_image", query: rest };
    }
    if (cmd === "gdz"){
      const numMatch = text.match(/(?:номер|№|задани[ея]|упражнени[ея]|страница|стр\.?)\s*(\d+)/i);
      const num = numMatch ? numMatch[1] : null;
      const gradeMatch = lower.match(/(\d{1,2})\s*класс/i);
      const grade = gradeMatch ? gradeMatch[1] : null;
      const subjectMatch = lower.match(/(алгебр|геометр|матем|физик|хими|биологи|русск|литератур|английск|истори|географи|информатик|обществ)/i);
      const subject = subjectMatch ? subjectMatch[1] : null;
      const authorCandidates = rest.split(/\s+/).filter(w => /^[А-ЯЁ][а-яё]{3,}$/.test(w) && !["гдз","номер","класс","упражнение","задание","страница"].includes(w.toLowerCase()));
      const author = authorCandidates.length ? authorCandidates[0] : null;
      if (!num && !subject){
        return { text: "Напиши хотя бы предмет или номер. Например: <i>@gdz алгебра 7 класс Макарычев номер 96</i>" };
      }
      return { async: "gdz", query: { num, grade, subject, author } };
    }
    if (cmd === "teach" || cmd === "wiki"){
      if (!rest) return { text: "Напиши запрос. Например: @"+cmd+" что такое фотосинтез" };
      memory.lastWikiQuery = rest;
      return { async: "search", query: rest, full: cmd === "teach" };
    }
  }

  /* ===== 6. ГРУБОСТЬ ===== */
  if (RUDE.test(lower)){
    return { text: noRepeat([
      "Понимаю, что могу ошибаться, но грубость делу не поможет. Давай по существу?",
      "Спокойно. Я здесь, чтобы помогать.",
      "Я не идеален, согласен. Но без оскорблений будет продуктивнее.",
    ])};
  }

  /* ===== 7. КРИТИКА / ИЗВИНЕНИЯ ===== */
  if (/(ты плохо|ты глуп|ты не понимаешь|ты бесполезен|ты ужасен|фигня|бред|чушь|ты не прав)/i.test(lower)){
    return { text: noRepeat(["Принял замечание. Уточни, что было не так.","Спасибо за обратную связь. Скажи, где именно."]) };
  }
  if (/(извини|прости|сорри|сори)/i.test(lower)){
    return { text: pick(["Ничего страшного, бывает. Чем помочь?","Всё в порядке! Продолжим?"]) };
  }

  /* ===== 8. МАЛЫЙ TALK ===== */
  if (/(как дела|как ты|как жизнь|как настроение|как сам|чё как|как поживаешь|как оно)/i.test(lower)){
    setTopic("smalltalk");
    return { text: noRepeat([
      "У меня всё отлично — я же программа. А у тебя как?",
      "Хорошо! Общаюсь с интересным человеком. А ты?",
      "Работаю в лучшем виде. А у тебя что нового?",
    ])};
  }
  if (/(чем занимаешься|что делаешь|ты тут|ау|есть кто|ты здесь|ты где)/i.test(lower)){
    setTopic("smalltalk");
    return { text: noRepeat([
      "Отвечаю на вопросы, ищу информацию, считаю примеры. А ты чем занят?",
      "Читаю твой запрос и думаю, чем помочь. Что у тебя на уме?",
    ])};
  }
  if (/(скучно|тоска|нечего делать)/i.test(lower)){
    return { text: noRepeat([
      "Скучно? Могу рассказать факт, шутку или определение. Что выберешь?",
      "Давай развлечёмся: спроси «расскажи факт» или «расскажи шутку».",
    ])};
  }

  /* ===== 9. О СЕБЕ ===== */
  if (/(кто ты|ты кто|что ты такое|ты человек|ты робот|ты бот|ты живой|ты настоящий|ты ии)/i.test(lower)){
    return { text: "Я — check, быстрый российский искусственный интеллект, работаю прямо в браузере. Умею искать информацию, рассказывать погоду, считать примеры, проверять текст, переводить, генерировать картинки и QR, ставить таймеры." };
  }
  if (/(как тебя зовут|твое имя|твоё имя|как звать)/i.test(lower)){
    return { text: "Меня зовут check." };
  }
  if (/(что ты умеешь|помощь|help|команды|что можешь|твои возможности)/i.test(lower)){
    return { text: "Я умею:<br><br>"+
      "• Погода: «погода в Краснодаре»<br>"+
      "• Определения: «что такое груша»<br>"+
      "• Математика: 12*8+4, √16, 5!, sin(30)<br>"+
      "• Сложная математика и физика: @math<br>"+
      "• Проверка текста: @fix<br>"+
      "• Резюме: @sum<br>"+
      "• Перевод: @tr<br>"+
      "• QR-код: @qr<br>"+
      "• Таймер: @timer 5м<br>"+
      "• ГДЗ: @gdz алгебра 7 класс номер 96<br>"+
      "• Картинки: @img кот в космосе<br>"+
      "• Шутки, факты, цитаты<br>"+
      "• OCR с фото (кнопка «+»)<br><br>"+
      "Команды: @teach, @wiki, @fix, @sum, @tr, @math, @img, @qr, @timer, @gdz, @weather, @help"
    };
  }

  /* ===== 10. ЗНАКОМСТВО ===== */
  let m = lower.match(/меня зовут\s+([а-яёa-z\-]+)/i);
  if (m){
    memory.userName = m[1].charAt(0).toUpperCase()+m[1].slice(1);
    const p = loadProfile(); p.name = memory.userName; saveProfile(p);
    return { text: pick(["Приятно познакомиться, "+memory.userName+"!","Очень приятно, "+memory.userName+"!"]) };
  }

  /* ===== 11. ГДЗ ===== */
  const isGdz = /(гдз|решебник|домашк|домашн|д\/з|дз|реши\s+номер|помоги\s+с\s+номером|номер\s+\d+|упражнени[ея]\s+\d+|задани[ея]\s+\d+)/i.test(lower);
  if (isGdz){
    const numMatch = text.match(/(?:номер|№|задани[ея]|упражнени[ея]|страница|стр\.?)\s*(\d+)/i);
    const num = numMatch ? numMatch[1] : null;
    const gradeMatch = lower.match(/(\d{1,2})\s*класс/i);
    const grade = gradeMatch ? gradeMatch[1] : null;
    const subjectMatch = lower.match(/(алгебр|геометр|матем|физик|хими|биологи|русск|литератур|английск|истори|географи|информатик|обществ)/i);
    const subject = subjectMatch ? subjectMatch[1] : null;
    const authorCandidates = text.split(/\s+/).filter(w => /^[А-ЯЁ][а-яё]{3,}$/.test(w) && !["гдз","номер","класс","упражнение","задание","страница"].includes(w.toLowerCase()));
    const author = authorCandidates.length ? authorCandidates[0] : null;
    if (!num && !subject){
      return { text: "Уточни предмет или номер. Например: <i>гдз алгебра 7 класс Макарычев номер 96</i>" };
    }
    return { async: "gdz", query: { num, grade, subject, author } };
  }

  /* ===== 12. ПЕРЕВОД (без @) ===== */
  if (/^(переведи|перевод)\s+/i.test(lower)){
    const rest = text.replace(/^(переведи|перевод)\s+/i, "").trim();
    const hasCyr = /[а-яё]/i.test(rest);
    return { async: "translate", query: rest, from: hasCyr ? "ru" : "en", to: hasCyr ? "en" : "ru" };
  }

  /* ===== 13. РЕЗЮМЕ (без @) ===== */
  if (/^(сократи|резюме|кратко)\s+/i.test(lower) && text.length > 30){
    const rest = text.replace(/^(сократи|резюме|кратко)\s+/i, "").trim();
    return { async: "summarize", query: rest };
  }

  /* ===== 14. МАТЕМАТИКА (локально) ===== */
  m = lower.match(/(\d+\.?\d*)\s*%\s*(от|of)\s*(\d+\.?\d*)/);
  if (m){
    const p = parseFloat(m[1]), n = parseFloat(m[3]);
    return { text: fmt(p)+"% от "+fmt(n)+" = "+fmt(p*n/100)+"." };
  }
  m = lower.match(/√\s*(\d+\.?\d*)/);
  if (m){ return { text: "√"+m[1]+" = "+fmt(Math.sqrt(parseFloat(m[1]))) }; }
  m = lower.match(/корень\s+(?:из\s+)?(\d+\.?\d*)/i);
  if (m){ return { text: "Корень из "+m[1]+" = "+fmt(Math.sqrt(parseFloat(m[1]))) }; }
  m = lower.match(/(\d+)\s*!/);
  if (m){
    const n = parseInt(m[1]);
    if (n > 170) return { text: "Слишком большое." };
    let r = 1; for (let i=2;i<=n;i++) r *= i;
    return { text: n+"! = "+r };
  }
  m = lower.match(/(sin|cos|tg|tan|log|ln)\s*\(?\s*(\d+\.?\d*)\s*\)?/i);
  if (m){
    const fn = m[1].toLowerCase(), x = parseFloat(m[2]);
    let r;
    if (fn==="sin") r = Math.sin(x*Math.PI/180);
    else if (fn==="cos") r = Math.cos(x*Math.PI/180);
    else if (fn==="tg" || fn==="tan") r = Math.tan(x*Math.PI/180);
    else if (fn==="log") r = Math.log10(x);
    else r = Math.log(x);
    return { text: fn+"("+x+") = "+fmt(+r.toFixed(6)) };
  }
  if (/(сколько|чему)\s*(равно|равен)?\s*(пи|π)/i.test(lower)){ return { text: "π ≈ 3.141592653589793…" }; }

  /* ===== 15. ДРОБИ ===== */
  const fracResult = parseFractionExpression(text);
  if (fracResult){
    const { num, den } = fracResult;
    const numStr = num < 0 ? "-"+Math.abs(num) : num;
    if (den === 1) return { text: formatFractions("Результат: "+num) };
    const fracHtml = '<span class="fraction"><span class="num">'+numStr+'</span><span class="den">'+den+'</span></span>';
    return { text: "Результат: "+fracHtml };
  }

  /* ===== 16. КОНВЕРТАЦИЯ ===== */
  m = lower.match(/(\d+\.?\d*)\s*(км|м|см|кг|г|°c|c|°f|f|долл[а-я]*|usd|евро|eur|рубл[а-я]*|rub)\s*(в|to)\s*([а-яa-z°]+)/i);
  if (m){
    const conv = convert(parseFloat(m[1]), m[2], m[4]);
    if (conv) return { text: conv };
  }

  /* ===== 17. ВРЕМЯ / ДАТА ===== */
  if (/(который час|сколько времени|время сейчас)/i.test(lower)){
    const d = new Date();
    return { text: "Сейчас "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+"." };
  }
  if (/(какое сегодня число|какая дата|какой сегодня день|дата сегодня|какой день недели|какое число)/i.test(lower)){
    const d = new Date();
    const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
    const days = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
    return { text: "Сегодня "+d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear()+", "+days[d.getDay()]+"." };
  }

  /* ===== 18. ШУТКИ / ФАКТЫ / ЦИТАТЫ ===== */
  if (/(шутк|анекдот|рассмеши|пошути|смешн)/i.test(lower)){ return { text: noRepeat(JOKES) }; }
  if (/(факт|интересное|расскажи что-нибудь|удиви)/i.test(lower)){ return { text: noRepeat(FACTS) }; }
  if (/(цитат|мотивир|вдохнови)/i.test(lower)){ return { text: noRepeat(QUOTES) }; }

  /* ===== 19. БЛАГОДАРНОСТЬ / ПРОЩАНИЕ ===== */
  if (isThanks(text)){
    const name = memory.userName ? ", "+memory.userName : "";
    return { text: noRepeat(["Пожалуйста"+name+"!","Всегда пожалуйста"+name+"!","Обращайся"+name+"!"]) };
  }
  if (/(пока|до свидания|прощай|bye|до встречи|спокойной ночи)/i.test(lower)){
    const name = memory.userName ? ", "+memory.userName : "";
    return { text: noRepeat(["До встречи"+name+"!","Пока"+name+"! Было приятно."]) };
  }

  /* ===== 20. ЭМОЦИИ ===== */
  if (/(мне грустно|грустно|плохо|печаль|тоскливо|депресс|тяжело|не могу больше)/i.test(lower)){
    return { text: noRepeat([
      "Слышу. Иногда правда тяжело. Хочешь расскажешь, что случилось?",
      "Понимаю. Я рядом. Можем просто поговорить — или я подкину что-то интересное.",
    ])};
  }
  if (/(мне весело|хорошее настроение|у меня отлично|я счастлив|я рад|класс)/i.test(lower)){
    return { text: noRepeat(["Отлично! Рад за тебя.","Круто! Что хорошего случилось?"]) };
  }

  /* ===== 21. ПОГОДА ===== */
  if (WEATHER_WORDS.some(w=>lower.includes(w))){
    const city = extractCity(text);
    if (city) return { async: "weather", city };
    memory.state.awaiting = { kind: "city" };
    const hint = memory.citiesSeen.length ? " Могу по последним: " + memory.citiesSeen.slice(-3).join(", ") + "." : "";
    return { text: "Погоду в каком городе?" + hint };
  }

  /* ===== 22. ПРОСТАЯ МАТЕМАТИКА ===== */
  const mathExpr = extractMath(text);
  if (mathExpr && /[+\-*/^%]/.test(mathExpr)){
    const val = safeMath(mathExpr);
    if (val !== null){
      memory.lastExpr = mathExpr; memory.lastResult = val;
      const opener = pick(["Посчитал: ","Получается: ","Вот результат: ","Итого: ",""]);
      return { text: opener + mathExpr + " = " + fmt(val) + "." };
    }
  }

  /* ===== 23. ГЕНЕРАЦИЯ КАРТИНОК ===== */
  if (/(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк|изображени|фото|рисунок|арт|постер)/i.test(lower)){
    const prompt = text.replace(/^(нарисуй|сгенерируй|создай|сделай|покажи)\s+(картинк[уи]?|изображени[ея]?|фото|рисунок|арт|постер)\s*/i, "").trim();
    return { async: "pollinations_image", query: prompt || "красивый пейзаж" };
  }

  /* ===== 24. QR-КОД ===== */
  if (/^(сделай|создай|сгенерируй)\s+qr/i.test(lower)){
    const rest = text.replace(/^(сделай|создай|сгенерируй)\s+qr(-код)?\s*/i, "").trim();
    if (rest) return { async: "qr", query: rest };
    return { text: "Напиши текст для QR-кода. Например: <i>@qr https://example.com</i>" };
  }

  /* ===== 25. ТАЙМЕР ===== */
  if (/^(таймер|поставь таймер|засеки)\s*/i.test(lower)){
    const rest = text.replace(/^(таймер|поставь таймер|засеки)\s*/i, "");
    const m = rest.match(/(\d+)\s*(с|сек|м|мин|ч|час)/i);
    if (!m) return { text: "Укажи время. Например: <i>@timer 5м</i>" };
    const n = parseInt(m[1]);
    const unit = m[2].toLowerCase();
    let secs = n;
    if (unit.startsWith("м") || unit.startsWith("min")) secs = n * 60;
    if (unit.startsWith("ч") || unit.startsWith("час")) secs = n * 3600;
    if (secs > 3600) return { text: "Слишком долго." };
    return { async: "timer", seconds: secs, label: n + (unit.startsWith("с") ? " сек" : unit.startsWith("м") ? " мин" : " ч") };
  }

  /* ===== 26. СЛОЖНАЯ МАТЕМАТИКА / ФИЗИКА ===== */
  if (/(интеграл|производн|уравнени|матриц|предел|дифференц|система уравнени|доказать тождество)/i.test(lower)){
    return { async: "wolfram", query: text };
  }
  if (/(закон ньютон|закон ом|ускорени|сила тяжест|работа силы|импульс тела)/i.test(lower)){
    return { async: "wolfram", query: text };
  }

  /* ===== 27. ПОИСК ЗНАНИЙ ===== */
  const searchMatch = text.match(/(?:что такое|кто такой|кто такая|кто такие|расскажи про|расскажи о|расскажи об|объясни|объясните|поясни|растолкуй|что значит|определение|что означает|что за|в чём смысл|в чем смысл|найди|поищи|загугли)\s+(.+?)[?!.]*$/i);
  let searchQuery = null;
  if (searchMatch) searchQuery = searchMatch[1].trim();
  else if (/(война|революц|битв|сражен|древн|средневек|импери|династ|эпох|античн|ренессанс|просвещен|феодал)/i.test(lower)){
    searchQuery = text.replace(/[?!.]+$/,"").trim();
  }
  if (searchQuery && searchQuery.length >= 2 && searchQuery.length <= 100){
    memory.lastWikiQuery = searchQuery;
    return { async: "search", query: searchQuery };
  }

  /* ===== 28. ЛОКАЛЬНЫЕ ТЕМЫ ===== */
  const topicObj = detectTopic(lower);
  if (topicObj){
    memory.lastTopicObj = topicObj;
    memory.state.topic = "topic:"+topicObj.id;
    return { text: topicResponse(topicObj), chips: topicObj.suggestions };
  }

  /* ===== 29. СЛОЖНЫЙ ВОПРОС ===== */
  if (
    text.length > 25 &&
    /(объясни|расскажи|почему|как работает|что будет если|предскажи|придумай|сочини|опиши|приведи пример|докажи|сравни|разбери)/i.test(lower) &&
    !/(погод|температур|дожд|снег)/i.test(lower) &&
    !/(что такое|кто такой|кто такая|определение)/i.test(lower) &&
    !/(гдз|номер|упражнени|задани)/i.test(lower)
  ){
    return { async: "pollinations_text", query: text };
  }

  /* ===== 30. ГОРОД ОДНИМ СЛОВОМ ===== */
  if (looksLikeCity(text)) return { async: "weather", city: text.trim() };

  /* ===== 31. ОБЩИЙ РАЗГОВОР ===== */
  const words = text.replace(/[?!.,;:]/g,"").split(/\s+/).filter(w => w.length >= 4);
  if (words.length >= 1){
    const anchor = words[Math.floor(Math.random()*words.length)];
    return { text: pick([
      "Интересно, что ты заговорил про «"+anchor+"». Расскажи подробнее.",
      "«"+anchor+"» — любопытно. Давай разберём?",
      "Могу поискать «"+anchor+"» — скажи «найди "+anchor+"».",
    ])};
  }
  return { text: noRepeat([
    "Расскажи чуть подробнее — я подстроюсь.",
    "Хм, давай разберёмся. Что именно тебя интересует?",
    "Могу поговорить на разные темы — просто скажи, куда копать.",
  ])};
}

function followUpResponse(kind){
  const topicObj = memory.lastTopicObj;
  if (topicObj){
    if (kind === "more" || kind === "fact") return { text: pick(topicObj.facts), chips: topicObj.suggestions };
    if (kind === "why") return { text: pick(["По сути — так устроено. "+pick(topicObj.facts),"Хороший вопрос. "+pick(topicObj.opinions)]) };
    if (kind === "how") return { text: "Если коротко — это работает по своим правилам. "+pick(topicObj.facts) };
    if (kind === "opinion" || kind === "choice") return { text: pick(topicObj.opinions) };
    if (kind === "whatif") return { text: "Тогда, скорее всего, всё было бы иначе." };
    if (kind === "so") return { text: "Вот такой расклад. Копнём глубже или сменим тему?" };
  }
  if (kind === "why") return { text: "Если коротко — так сложилось. Хочешь разберём подробнее?" };
  if (kind === "how") return { text: "Могу объяснить по шагам — уточни, что разобрать." };
  if (kind === "more" || kind === "fact") return { text: noRepeat(FACTS) };
  if (kind === "whatif") return { text: "Зависит от условий. Опиши ситуацию — прикинем." };
  if (kind === "opinion" || kind === "choice") return { text: "Я программа, но могу сравнить варианты. Что сравниваем?" };
  if (kind === "so") return { text: "Вот такой расклад. Что дальше?" };
  return { text: "Уточни — я не до конца понял." };
}

function extractCity(text){
  let m = text.match(/\bв[о]?\s+([А-ЯЁа-яё][а-яё\-]+)/i);
  if (m) return m[1];
  m = text.match(/погода\s+([А-ЯЁа-яё][а-яё\-]+)/i);
  if (m) return m[1];
  const words = text.replace(/[?!.,]/g,"").split(/\s+/);
  for (const w of words){ if (WEATHER_DB[resolveCity(w)]) return w; }
  return null;
}
function looksLikeCity(text){
  const t = text.trim().replace(/[?!.]+$/,"");
  if (!/^[А-ЯЁа-яё][а-яё\-]{2,25}$/i.test(t)) return false;
  const stop = ["привет","пока","спасибо","пожалуйста","да","нет","ок","хорошо","плохо","скучно"];
  return !stop.includes(t.toLowerCase());
}

function downloadFile(content, name, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function chatToMarkdown(chat){
  let md = "# " + chat.title + "\n\n";
  md += "*Создано: " + new Date(chat.createdAt).toLocaleString("ru") + "*\n\n---\n\n";
  chat.messages.forEach(m => {
    const who = m.who === "user" ? "**Вы**" : "**check**";
    const text = m.text.replace(/<[^>]+>/g, "").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
    md += who + ":\n\n" + text + "\n\n---\n\n";
  });
  return md;
}
function handleCtxAction(action, chatId){
  const chat = getChat(chatId);
  if (!chat) return;
  if (action === "delete"){
    if (confirm("Удалить чат «"+chat.title+"»?")){
      deleteChat(chatId);
      renderHome();
      if (currentChatId === chatId) goHome();
    }
    return;
  }
  if (action === "rename"){
    const newName = prompt("Новое название:", chat.title);
    if (newName && newName.trim()){
      updateChat(chatId, { title: newName.trim() });
      renderHome();
      if (currentChatId === chatId) chatTitleEl.textContent = newName.trim();
    }
    return;
  }
  if (action === "export"){
    try {
      const data = JSON.stringify(chat, null, 2);
      const safeName = (chat.title || "chat").replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, "_");
      downloadFile(data, safeName + ".json", "application/json");
      showToast("Чат экспортирован");
    } catch(err) { alert("Ошибка: " + err.message); }
    return;
  }
  if (action === "export-md"){
    try {
      const md = chatToMarkdown(chat);
      const safeName = (chat.title || "chat").replace(/[^a-zA-Z0-9а-яА-ЯёЁ]/g, "_");
      downloadFile(md, safeName + ".md", "text/markdown");
      showToast("Markdown сохранён");
    } catch(err) { alert("Ошибка: " + err.message); }
    return;
  }
  if (action === "import"){
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json";
    input.style.display = "none";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && Array.isArray(imported.messages)){
            imported.id = "chat_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
            imported.title = imported.title || "Импортированный чат";
            imported.preview = imported.preview || "";
            imported.createdAt = imported.createdAt || Date.now();
            imported.updatedAt = Date.now();
            const chats = loadChats();
            chats.unshift(imported);
            saveChats(chats);
            renderHome();
            showToast("Чат импортирован");
          } else alert("Неверный формат");
        } catch (err) { alert("Ошибка: " + err.message); }
      };
      reader.readAsText(file);
    };
    document.body.appendChild(input); input.click(); document.body.removeChild(input);
    return;
  }
}

function streamText(el, fullText, done){
  el.dataset.full = fullText;
  el.dataset.streaming = "1";
  el.textContent = "";
  isStreaming = true;
  updateSendBtn();
  abortStream = false;
  const tokens = [];
  const re = /(<[^>]+>|[\s\S])/g;
  let m;
  while ((m = re.exec(fullText))) tokens.push(m[1]);
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.appendChild(cursor);
  const plainLen = fullText.replace(/<[^>]+>/g,"").length;
  const speed = plainLen > 200 ? 14 : (plainLen > 80 ? 20 : 28);
  let i = 0;
  streamTimer = setInterval(()=>{
    if (abortStream){ clearInterval(streamTimer); streamTimer = null; return; }
    const step = plainLen > 200 ? 4 : (plainLen > 80 ? 2 : 1);
    let emitted = 0;
    while (i < tokens.length && emitted < step){
      const tk = tokens[i++];
      if (/^</.test(tk)){
        const span = document.createElement("span");
        span.innerHTML = tk;
        while (span.firstChild) el.insertBefore(span.firstChild, cursor);
      } else { cursor.insertAdjacentText("beforebegin", tk); emitted++; }
    }
    scrollBottom();
    if (i >= tokens.length){
      clearInterval(streamTimer); streamTimer = null;
      cursor.remove();
      el.innerHTML = fullText;
      el.dataset.streaming = "0";
      isStreaming = false;
      updateSendBtn();
      scrollBottom();
      if (done) done();
    }
  }, speed);
}

function handleTimer(seconds, label){
  let remaining = seconds;
  const botEl = addMsg("", "bot");
  botEl.innerHTML = '<div class="timer-badge">' + ICONS.timer + '<span class="timer-text">' + formatTime(seconds) + '</span></div>';
  scrollBottom();
  const textEl = botEl.querySelector(".timer-text");
  const interval = setInterval(()=>{
    remaining--;
    if (remaining <= 0){
      clearInterval(interval);
      textEl.textContent = "Время вышло!";
      botEl.querySelector(".timer-badge").classList.add("done");
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch {}
      showToast("Таймер завершён");
      persistMessage("bot", "Таймер на " + label + " завершён");
      updatePreviewFromLastBot();
      return;
    }
    textEl.textContent = formatTime(remaining);
  }, 1000);
  persistMessage("bot", "Таймер на " + label);
  updatePreviewFromLastBot();
}
function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  if (m > 0) return m + ":" + String(sec).padStart(2,"0");
  return "0:" + String(sec).padStart(2,"0");
}

let recognition = null;
let isRecording = false;
function initSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "ru-RU";
  r.continuous = false;
  r.interimResults = true;
  return r;
}
micBtn.addEventListener("click", ()=>{
  if (!recognition){
    recognition = initSpeechRecognition();
    if (!recognition){
      showToast("Голосовой ввод не поддерживается");
      return;
    }
    recognition.onresult = (e)=>{
      let transcript = "";
      for (let i = e.resultIndex; i < e.results.length; i++){
        transcript += e.results[i][0].transcript;
      }
      inputEl.value = transcript;
      inputEl.dispatchEvent(new Event("input"));
    };
    recognition.onerror = ()=>{ stopRecording(); };
    recognition.onend = ()=>{ stopRecording(); };
  }
  if (isRecording) stopRecording();
  else startRecording();
});
function startRecording(){
  try {
    recognition.start();
    isRecording = true;
    micBtn.classList.add("recording");
    showToast("Говорите...");
  } catch {}
}
function stopRecording(){
  try { recognition.stop(); } catch {}
  isRecording = false;
  micBtn.classList.remove("recording");
}

function send(){
  const text = inputEl.value.trim();
  if (!text) return;
  if (welcomeEl) welcomeEl.style.display = "none";
  cmdPanel.classList.remove("visible");
  atBtn.classList.remove("active");
  lastActivityAt = Date.now();

  addMsg(text, "user");
  persistMessage("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  charCounter.classList.remove("visible");
  updateSendBtn();

  const reply = botReplySync(text);

  if (reply && reply.async === "search"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleSearch(reply.query, { full: reply.full }); }, 300 + Math.random()*300);
    return;
  }
  if (reply && reply.async === "fix"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleFix(reply.query); }, 350);
    return;
  }
  if (reply && reply.async === "translate"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleTranslate(reply.query, reply.from, reply.to); }, 350);
    return;
  }
  if (reply && reply.async === "summarize"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleSummarize(reply.query); }, 350);
    return;
  }
  if (reply && reply.async === "qr"){
    showTypingIndicator();
    setTimeout(()=>{ hideTypingIndicator(); handleQr(reply.query); }, 300);
    return;
  }
  if (reply && reply.async === "timer"){
    showTypingIndicator();
    setTimeout(()=>{ hideTypingIndicator(); handleTimer(reply.seconds, reply.label); }, 300);
    return;
  }
  if (reply && reply.async === "gdz"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleGdz(reply.query); }, 400);
    return;
  }
  if (reply && reply.async === "wolfram"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleWolfram(reply.query); }, 400);
    return;
  }
  if (reply && reply.async === "pollinations_text"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handlePollinationsText(reply.query); }, 400);
    return;
  }
  if (reply && reply.async === "pollinations_image"){
    showTypingIndicator();
    setTimeout(()=>{ hideTypingIndicator(); handlePollinationsImage(reply.query); }, 400);
    return;
  }
  if (reply && reply.async === "weather"){
    showTypingIndicator();
    setTimeout(async ()=>{ hideTypingIndicator(); await handleWeather(reply.city); }, 250 + Math.random()*250);
    return;
  }

  showTypingIndicator();
  const thinkDelay = 300 + Math.random()*500;
  setTimeout(()=>{
    hideTypingIndicator();
    const botEl = document.createElement("div");
    botEl.className = "msg bot";
    messagesEl.appendChild(botEl);
    const textHtml = applyTone(reply.text);
    streamText(botEl, textHtml, ()=>{
      if (reply.chips && reply.chips.length){
        attachChips(botEl, reply.chips, (label)=>{
          inputEl.value = label;
          inputEl.dispatchEvent(new Event("input"));
          send();
        });
      }
      botEl.addEventListener("click", (e)=>{
        if (e.target.tagName === "A" || e.target.closest("button")) return;
        copyToClipboard(botEl.innerText);
      });
      persistMessage("bot", textHtml);
      updatePreviewFromLastBot();
    });
  }, thinkDelay);
}

function scheduleIdleCheck(){
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    if (!currentChatId) return;
    if (isStreaming) return;
    const since = Date.now() - lastActivityAt;
    if (since < 60000) return;
    if (!memory.state.topic) return;
    const txt = pick(["Ещё думаешь? Я рядом.","Если что — я здесь.","Можем продолжить или сменить тему."]);
    const botEl = addMsg("", "bot");
    streamText(botEl, txt, ()=>{ persistMessage("bot", txt); updatePreviewFromLastBot(); });
  }, 60000);
}

backBtn.addEventListener("click", goHome);
newChatBtn.addEventListener("click", startNewChat);
fabNew.addEventListener("click", startNewChat);
fabSearch.addEventListener("click", openSearch);
searchClose.addEventListener("click", closeSearch);
searchInput.addEventListener("input", (e)=> renderSearchResults(e.target.value));
themeBtn.addEventListener("click", ()=>{
  const isDark = document.documentElement.classList.contains("dark");
  applyTheme(!isDark);
  localStorage.setItem(THEME_KEY, !isDark ? "dark" : "light");
});
menuBtn.addEventListener("click", ()=>{
  const name = memory.userName ? "Привет, "+memory.userName+"!" : "Привет!";
  addMsg(name+" Я check. Могу искать, считать, проверять текст, переводить, генерировать картинки и QR, ставить таймеры. Пиши что угодно.", "bot");
});
screenEl.addEventListener("click", (e)=>{
  if (e.target === screenEl || e.target === welcomeEl || e.target.closest(".welcome")) inputEl.focus();
});

function init(){
  initTheme();
  renderWelcomeChips();
  renderHome();
  const lastId = localStorage.getItem(CURRENT_KEY);
  if (lastId && getChat(lastId)) openChat(lastId);
  else { homeScreen.classList.remove("hidden"); chatScreen.classList.add("hidden"); }
  scheduleIdleCheck();
}
init();
</script>
