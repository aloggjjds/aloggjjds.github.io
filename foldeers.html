<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
  }

  /* ===== ФОН — твоя вторая картинка ===== */
  .wallpaper {
    position: fixed;
    inset: 0;
    background-image: url('https://i.ibb.co/TBBv8RcK/IMG-4322.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  /* ===== Ряд папок сверху ===== */
  .folders {
    position: fixed;
    top: 4vh;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 3vw;
    z-index: 5;
    padding: 0 3vw;
    flex-wrap: nowrap;
  }

  .folder-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2vh;
    cursor: pointer;
    transition: transform 0.15s ease;
    flex: 0 0 auto;
  }
  .folder-block:active {
    transform: scale(0.94);
  }

  /* Иконка папки — твоя текстура, теперь МЕЛЬЧЕ */
  .folder-icon {
    width: 15vw;
    height: 13.5vw;
    max-width: 130px;
    max-height: 117px;
    min-width: 72px;
    min-height: 65px;
    background-image: url('https://i.ibb.co/xtfmQyYF/5-20261021205232.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-radius: 8px;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45));
    image-rendering: -webkit-optimize-contrast;
  }

  /* Текст под папками */
  .folder-label {
    font-size: 2.2vw;
    color: #fff;
    font-weight: 700;
    text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.65);
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* Ограничения для больших экранов */
  @media (min-width: 900px) {
    .folder-label { font-size: 18px; }
    .folders { gap: 28px; }
  }

  /* На узких экранах iPad/телефоне */
  @media (max-width: 600px) {
    .folders { gap: 2vw; padding: 0 2vw; }
    .folder-icon {
      width: 12.5vw;
      height: 11vw;
    }
    .folder-label { font-size: 2.4vw; }
  }
</style>
</head>
<body>

  <!-- ФОН — без изменений -->
  <div class="wallpaper"></div>

  <!-- Ряд из 7 папок сверху -->
  <div class="folders">
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Загрузки</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Программы</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Документы</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Фото</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Музыка</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Проекты</div>
    </div>
    <div class="folder-block">
      <div class="folder-icon"></div>
      <div class="folder-label">Корзина</div>
    </div>
  </div>

</body>
</html>
